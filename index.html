<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учебник к экзамену · 22 темы с нуля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d0e13;--surface:#16181f;--surface-2:#1c1f29;--surface-3:#23262f;
    --text:#ece8df;--muted:#9b978d;--muted-2:#67645d;--line:#2a2d37;--line-soft:#21232c;
    --accent:#f0b54a;--accent-soft:rgba(240,181,74,0.13);
    --radius:16px;--maxw:1180px;
    --hw:#f0b54a;--swd:#ef8e6b;--web:#5ec8c0;--alg:#b69cf0;
    --db:#7cc379;--sec:#ec7b8a;--sys:#6fa8e8;--ml:#e08ec9;
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 12% -5%,rgba(240,181,74,0.09),transparent 60%),radial-gradient(800px 700px at 92% 8%,rgba(94,200,192,0.07),transparent 55%),radial-gradient(1000px 800px at 50% 110%,rgba(182,156,240,0.06),transparent 60%)}
  #app{position:relative;z-index:1}
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(13,14,19,0.82);border-bottom:1px solid var(--line-soft)}
  .head-inner{max-width:var(--maxw);margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
  .brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#e08948);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:#1a1206;box-shadow:0 4px 18px rgba(240,181,74,0.25)}
  .brand-txt h1{font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:-0.01em;line-height:1.1}
  .brand-txt span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .search{position:relative}
  .search input{width:220px;max-width:46vw;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:9px 14px 9px 36px;border-radius:11px;font-size:14px;font-family:inherit;transition:.2s}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .progress-wrap{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .ring{width:38px;height:38px;flex-shrink:0}
  .ring circle{fill:none;stroke-width:4}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease;transform:rotate(-90deg);transform-origin:center}
  .progress-num b{color:var(--text);font-size:14px}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px}
  .tab{border:none;background:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap}
  .tab.active{background:var(--surface-3);color:var(--text)}
  .tab:hover:not(.active){color:var(--text)}
  main{max-width:var(--maxw);margin:0 auto;padding:34px 24px 80px}
  .hero{margin-bottom:32px}
  .hero .kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .hero h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1.06;letter-spacing:-0.02em;max-width:20ch}
  .hero h2 em{font-style:italic;color:var(--accent)}
  .hero p{color:var(--muted);max-width:62ch;margin-top:15px;font-size:16px}
  .hero-tip{margin-top:18px;display:flex;align-items:flex-start;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 16px;font-size:13.5px;color:var(--muted);max-width:62ch}
  .hero-tip b{color:var(--text)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 22px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:99px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:7px}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .chip:hover{color:var(--text);border-color:var(--muted-2)}
  .chip.active{border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;cursor:pointer;overflow:hidden;transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s,box-shadow .22s;opacity:0;transform:translateY(14px);animation:rise .5s forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat);opacity:0;transition:.22s}
  .card:hover{transform:translateY(-4px);border-color:var(--cat);box-shadow:0 18px 40px -22px var(--cat)}
  .card:hover::before{opacity:1}
  .card .num{position:absolute;top:14px;right:18px;font-family:'Fraunces',serif;font-size:38px;font-weight:500;color:var(--line);line-height:1;transition:.22s}
  .card:hover .num{color:var(--cat);opacity:.55}
  .card .cat-tag{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--cat);margin-bottom:13px}
  .card .cat-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cat)}
  .card h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px;line-height:1.18;letter-spacing:-0.01em;padding-right:38px;margin-bottom:8px}
  .card .teaser{color:var(--muted);font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.learned{border-color:color-mix(in srgb,var(--cat) 55%,var(--line))}
  .card .learned-badge{position:absolute;bottom:16px;right:18px;opacity:0;transform:scale(.6);transition:.2s}
  .card.learned .learned-badge{opacity:1;transform:scale(1)}
  .empty{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
  .lesson{max-width:760px;margin:0 auto;animation:fadeUp .4s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .back{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;margin-bottom:24px;transition:.18s}
  .back:hover{color:var(--accent);gap:11px}
  .l-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}
  .l-num{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(46px,9vw,72px);line-height:.85;color:var(--cat);flex-shrink:0;letter-spacing:-0.03em}
  .l-head-txt{padding-top:5px}
  .l-cat{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--cat);margin-bottom:9px}
  .l-cat .dot{width:8px;height:8px;border-radius:50%;background:var(--cat)}
  .l-title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(25px,4.5vw,34px);line-height:1.08;letter-spacing:-0.02em}
  .intro{background:linear-gradient(135deg,color-mix(in srgb,var(--cat) 12%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--cat) 28%,var(--line));border-radius:16px;padding:22px 24px;margin:24px 0 14px}
  .intro .ib-tag{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cat);margin-bottom:13px;font-weight:600}
  .intro .ib-tag svg{width:15px;height:15px}
  .intro p{font-size:16px;line-height:1.65;color:#e4e0d6;margin-bottom:12px}
  .intro p:last-child{margin-bottom:0}
  .intro strong{color:#fff;font-weight:600}
  .intro .q{color:var(--cat);font-weight:600}
  .ls-title{display:flex;align-items:center;gap:11px;margin:38px 0 6px}
  .ls-title .bar{width:4px;height:22px;border-radius:2px;background:var(--cat)}
  .ls-title h3{font-family:'Fraunces',serif;font-weight:600;font-size:21px;letter-spacing:-0.01em}
  .ls-sub{color:var(--muted);font-size:14.5px;margin:0 0 18px;padding-left:15px}
  .diagram-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px 18px;margin-bottom:14px;text-align:center}
  .diagram-box svg{max-width:100%;height:auto;display:block;margin:0 auto}
  .diagram-box .dg-cap{margin-top:14px;font-size:13.5px;color:var(--muted);line-height:1.5;text-align:center}
  .diagram-box .dg-cap b{color:var(--text)}
  .concept{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;transition:border-color .2s}
  .concept:hover{border-color:color-mix(in srgb,var(--cat) 40%,var(--line))}
  .cc-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:color-mix(in srgb,var(--cat) 7%,var(--surface));border-bottom:1px solid var(--line-soft)}
  .cc-icon{width:30px;height:30px;border-radius:9px;background:var(--cat);color:#11110d;display:grid;place-items:center;flex-shrink:0;font-family:'Fraunces',serif;font-weight:600;font-size:15px}
  .cc-term{font-weight:700;font-size:16.5px;color:var(--text);line-height:1.25}
  .cc-term .lat{font-weight:500;color:var(--muted);font-size:13.5px;font-family:'JetBrains Mono',monospace}
  .cc-body{padding:16px 18px}
  .cc-row{display:flex;gap:11px;margin-bottom:13px}
  .cc-row:last-child{margin-bottom:0}
  .cc-row .rlabel{flex-shrink:0;width:78px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted-2);padding-top:3px}
  .cc-row .rtext{font-size:15px;line-height:1.6;color:#dcd8ce}
  .cc-row .rtext strong{color:var(--text);font-weight:600}
  .cc-row .rtext code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:var(--surface-3);padding:2px 6px;border-radius:5px;color:var(--accent)}
  .cc-row.why .rtext{color:#c9c5bb}
  .cc-row.why .rlabel{color:var(--cat)}
  .explain-block{font-size:15.5px;line-height:1.7;color:#d8d4ca;margin-bottom:14px}
  .explain-block p{margin-bottom:13px}
  .explain-block strong{color:var(--text);font-weight:600}
  .explain-block ul{list-style:none;margin:12px 0}
  .explain-block li{position:relative;padding-left:22px;margin-bottom:9px}
  .explain-block li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--cat);opacity:.7}
  .explain-block code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--surface-3);padding:2px 6px;border-radius:5px;color:var(--accent)}
  .example-box{background:#0c1410;border:1px solid color-mix(in srgb,var(--db) 25%,var(--line));border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .example-box .eb-tag{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--db);font-weight:600;margin-bottom:12px}
  .example-box p{font-size:15px;line-height:1.65;color:#dcd8ce;margin-bottom:10px}
  .example-box p:last-child{margin-bottom:0}
  .example-box strong{color:#fff}
  pre{background:#070809;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:11px 0;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;color:#9fd6cf}
  pre .cm{color:var(--muted-2)}
  .formal-box{background:#0a0b0f;border:1px solid var(--line);border-radius:14px;padding:18px 20px 18px;margin-bottom:14px;position:relative}
  .formal-box .fb-tag{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:600;margin-bottom:12px}
  .formal-box .fb-tag svg{width:15px;height:15px}
  .formal-box p{font-size:15px;line-height:1.7;color:#d8d4ca;margin-bottom:11px}
  .formal-box p:last-child{margin-bottom:0}
  .formal-box strong{color:var(--text);font-weight:600}
  .copy-btn{position:absolute;top:15px;right:16px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:8px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:6px}
  .copy-btn:hover{color:var(--accent);border-color:var(--accent)}
  .copy-btn.copied{color:var(--db);border-color:var(--db)}
  .remember-box{background:color-mix(in srgb,var(--cat) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cat) 25%,var(--line));border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .remember-box .rb-tag{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--cat);font-weight:600;margin-bottom:12px}
  .remember-box .rb-tag svg{width:15px;height:15px}
  .remember-box ul{list-style:none}
  .remember-box li{position:relative;padding-left:24px;margin-bottom:9px;font-size:15px;line-height:1.55;color:#dcd8ce}
  .remember-box li:last-child{margin-bottom:0}
  .remember-box li::before{content:"✓";position:absolute;left:2px;top:0;color:var(--cat);font-weight:700}
  .remember-box li strong{color:var(--text);font-weight:600}
  .selfcheck{background:var(--surface);border:1px dashed color-mix(in srgb,var(--cat) 40%,var(--line));border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .selfcheck .sc-tag{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--cat);font-weight:600;margin-bottom:13px}
  .selfcheck .sc-q{font-size:15.5px;color:var(--text);font-weight:600;margin-bottom:13px;line-height:1.5}
  .selfcheck .sc-reveal{background:none;border:1px solid var(--cat);color:var(--cat);font-family:inherit;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:9px;cursor:pointer;transition:.18s}
  .selfcheck .sc-reveal:hover{background:color-mix(in srgb,var(--cat) 14%,transparent)}
  .selfcheck .sc-answer{margin-top:13px;font-size:14.5px;line-height:1.6;color:#cfcbc1;display:none}
  .selfcheck .sc-answer.show{display:block;animation:fadeUp .3s}
  .selfcheck .sc-answer strong{color:var(--text)}
  .mark-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:26px;padding:14px;border-radius:12px;border:1px solid var(--cat);background:transparent;color:var(--cat);font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:.18s}
  .mark-btn:hover{background:color-mix(in srgb,var(--cat) 14%,transparent)}
  .mark-btn.done{background:var(--cat);color:#11110d}
  .l-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:22px;border-top:1px solid var(--line-soft)}
  .l-nav button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;text-align:left;transition:.18s;color:var(--text);font-family:inherit;min-width:0}
  .l-nav button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
  .l-nav button:disabled{opacity:.3;cursor:default}
  .l-nav .dir{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .l-nav .nt{font-family:'Fraunces',serif;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .l-nav .next{text-align:right}
  .gloss{border-bottom:1px dotted var(--muted);cursor:help}
  .gloss:hover{color:var(--accent)}
  .gloss-pop{position:fixed;z-index:200;max-width:300px;background:#05060a;border:1px solid var(--accent);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;color:#e8e4da;box-shadow:0 14px 40px -10px rgba(0,0,0,.7);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
  .gloss-pop.show{opacity:1;transform:translateY(0)}
  .gloss-pop b{color:var(--accent);display:block;margin-bottom:3px;font-family:'JetBrains Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  footer{max-width:var(--maxw);margin:40px auto 0;padding:30px 24px 50px;color:var(--muted-2);font-size:12.5px;font-family:'JetBrains Mono',monospace;text-align:center;border-top:1px solid var(--line-soft)}
  .howto{max-width:780px;margin:0 auto;animation:fadeUp .4s}
  .howto .kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .howto h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,4.5vw,38px);line-height:1.06;letter-spacing:-0.02em}
  .howto .lede{color:var(--muted);max-width:62ch;margin-top:14px;font-size:16px}
  .howto h3{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:38px 0 6px;display:flex;align-items:center;gap:12px}
  .howto h3 .hn{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-weight:600}
  .skeleton{margin:18px 0 6px;border-left:2px solid var(--line)}
  .sk-step{position:relative;padding:13px 0 13px 28px;border-bottom:1px solid var(--line-soft)}
  .sk-step:last-child{border-bottom:none}
  .sk-step::before{content:"";position:absolute;left:-6px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
  .sk-step h4{font-size:15px;font-weight:700;margin-bottom:3px}
  .sk-step p{font-size:14px;color:var(--muted);line-height:1.5}
  .dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0 6px}
  .dd{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface)}
  .dd.good{border-color:color-mix(in srgb,var(--db) 35%,var(--line))}
  .dd.bad{border-color:color-mix(in srgb,var(--sec) 35%,var(--line))}
  .dd .dd-h{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:13px}
  .dd.good .dd-h{color:var(--db)}
  .dd.bad .dd-h{color:var(--sec)}
  .dd ul{list-style:none}
  .dd li{position:relative;padding-left:20px;margin-bottom:10px;font-size:14px;color:#d4d0c6;line-height:1.5}
  .dd li:last-child{margin-bottom:0}
  .dd.good li::before{content:"✓";position:absolute;left:0;top:0;color:var(--db);font-weight:700}
  .dd.bad li::before{content:"✕";position:absolute;left:1px;top:0;color:var(--sec);font-weight:700;font-size:13px}
  .tactics{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line));border-radius:14px;padding:16px 20px;margin:20px 0 6px;font-size:15px;line-height:1.6;color:#d4d0c6}
  .tactics b{color:var(--text)}
  @media(max-width:640px){
    .head-inner{padding:12px 16px;gap:12px}
    .search input{width:130px}
    main{padding:24px 16px 60px}
    .l-head{gap:14px}
    .cc-row{flex-direction:column;gap:3px}
    .cc-row .rlabel{width:auto}
    .l-nav{flex-direction:column}
    .lesson{max-width:100%}
    .dd-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app">

{
id:1,cat:'hw',title:'Архитектура ЭВМ',q:'Архитектура ЭВМ.',
diagram:'<svg viewBox="0 0 440 230" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.bx{fill:#1c1f29;stroke:var(--cat);stroke-width:2}.cpu{fill:var(--cat)}.t1{fill:#ece8df;font-size:13px;font-weight:600;text-anchor:middle}.t2{fill:#11110d;font-size:13px;font-weight:700;text-anchor:middle}.ts{fill:#9b978d;font-size:10px;text-anchor:middle}.bus{stroke:var(--cat);stroke-width:2;fill:none;marker-end:url(#c)}.hd{fill:var(--cat);font-size:11px;text-anchor:middle;font-family:JetBrains Mono,monospace}</style><defs><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="var(--cat)"/></marker></defs><rect class="bx cpu" x="150" y="30" width="140" height="64" rx="10"/><text class="t2" x="220" y="54">Процессор (ЦП)</text><text class="t2" x="220" y="76" style="font-size:11px">АЛУ + УУ</text><rect class="bx" x="30" y="150" width="120" height="52" rx="10"/><text class="t1" x="90" y="172">Память</text><text class="ts" x="90" y="190">команды+данные</text><rect class="bx" x="290" y="150" width="120" height="52" rx="10"/><text class="t1" x="350" y="172">Ввод-вывод</text><text class="ts" x="350" y="190">клав., экран</text><path class="bus" d="M180 96 L110 148"/><path class="bus" d="M110 148 L175 98" opacity=".5"/><path class="bus" d="M260 96 L330 148"/><text class="hd" x="220" y="125">шины</text><text class="hd" x="220" y="222">команды и данные — в одной памяти (принцип фон Неймана)</text></svg><div class=\'dg-cap\'>Процессор (АЛУ+УУ) общается с памятью и устройствами по шинам. Главное: <b>команды и данные лежат в одной памяти</b>.</div>',
teaser:'Как устроен компьютер внутри и по каким правилам он работает.',
intro:`<p><span class="q">Простыми словами.</span> Эта тема — про то, как устроен компьютер «внутри»: не корпус и провода, а логическая схема. Что считает, где хранятся программы, как части между собой общаются.</p><p><span class="q">Зачем это нужно знать.</span> Чтобы понимать, <strong>почему</strong> компьютер вообще может выполнять любые программы — от игр до браузера, — и что ограничивает его скорость. Это фундамент всей информатики.</p>`,
concepts:[
{t:'ЭВМ',lat:'= электронно-вычислительная машина',plain:'Это просто старое, «официальное» название компьютера. На экзамене говорят «ЭВМ», в жизни — «компьютер». Это одно и то же.',why:'Термин используется в учебниках и ГОСТах, поэтому встречается в билете.'},
{t:'Архитектура фон Неймана',lat:'фон Нейман — учёный, придумал в 1945 г.',plain:'Это главная идея, по которой построены почти все компьютеры. Суть: <strong>команды программы и данные хранятся в одной и той же памяти</strong>, вперемешку, и для компьютера они выглядят одинаково — как числа.',why:'Это была революция. Раньше, чтобы «перепрограммировать» машину, надо было физически перепаивать провода. Фон Нейман предложил хранить программу как обычные данные в памяти — тогда машину можно перенастроить, просто загрузив другую программу. Так работает любой современный компьютер: одна и та же «железка» запускает и игру, и калькулятор.'},
{t:'4 принципа фон Неймана',lat:'',plain:'<strong>1) Однородность памяти</strong> — команды и данные лежат вместе, неотличимы. <strong>2) Адресность</strong> — память это пронумерованные ячейки, к каждой обращаются по номеру (адресу). <strong>3) Программное управление</strong> — команды выполняются по порядку, одна за другой. <strong>4) Двоичное кодирование</strong> — всё хранится в виде нулей и единиц.',why:'Эти 4 пункта почти всегда просят перечислить в ответе на билет — их стоит запомнить.'},
{t:'Процессор (ЦП)',lat:'ЦП = центральный процессор, англ. CPU',plain:'«Мозг» компьютера, который выполняет команды. Состоит из двух частей: <strong>АЛУ</strong> (арифметико-логическое устройство) — оно считает: складывает, сравнивает числа. И <strong>УУ</strong> (устройство управления) — оно решает, какую команду брать следующей, и всем дирижирует.',why:'Когда в билете спрашивают «состав ЭВМ», процессор = АЛУ + УУ — это первое, что надо назвать.'},
{t:'Память, устройства в/в, шины',lat:'',plain:'<strong>Память</strong> — где хранятся данные и программы (ОЗУ — оперативная, быстрая, но временная). <strong>Устройства ввода-вывода</strong> — клавиатура, экран, диск. <strong>Шины</strong> — это «провода-дорожки», по которым части компьютера передают друг другу данные (шина данных, адресная, управляющая).',why:'Это остальные части «состава ЭВМ» — называются после процессора.'},
{t:'Гарвардская архитектура',lat:'альтернатива фон Нейману',plain:'Здесь, наоборот, <strong>память команд и память данных разделены физически</strong> — это два отдельных хранилища. Благодаря этому можно одновременно читать и команду, и данные, что быстрее.',why:'Применяется в микроконтроллерах (крошечные компьютеры в технике) и в кэш-памяти процессора. На экзамене это противопоставляют фон Нейману: «у фон Неймана память общая, у Гарварда — раздельная».'},
{t:'CISC и RISC',lat:'два типа процессоров',plain:'Это два подхода к набору команд процессора. <strong>CISC</strong> (как в процессорах Intel/AMD для ПК, архитектура x86) — много сложных команд. <strong>RISC</strong> (как в процессорах телефонов, архитектура ARM) — мало простых команд, но они выполняются быстрее.',why:'Часто это финальный пункт ответа — показать, что знаешь про разные типы процессоров.'}
],
example:`<p>Возьмём простую команду <strong>C = A + B</strong> (сложить два числа). Вот что делает компьютер, шаг за шагом — это называется <strong>цикл «выборка → декодирование → исполнение»</strong>:</p><p>1. УУ берёт из памяти команду «сложить» (выборка).<br>2. УУ понимает, что это за команда (декодирование).<br>3. Достаёт числа A и B из памяти, АЛУ их складывает (исполнение).<br>4. Результат записывается обратно в память по адресу C.</p><p>И так — миллиарды раз в секунду. Вот почему компьютер «тупой, но очень быстрый».</p>`,
check:{q:'Чем отличается архитектура фон Неймана от гарвардской?',a:'У <strong>фон Неймана</strong> команды и данные хранятся в <strong>одной общей памяти</strong>. У <strong>гарвардской</strong> — в <strong>двух раздельных</strong> (память команд отдельно, память данных отдельно), что позволяет читать их одновременно и работать быстрее. Гарвардская применяется в микроконтроллерах.'},
formal:`<p><strong>Архитектура ЭВМ</strong> — это совокупность принципов организации вычислительной машины: состав устройств, их взаимодействие и система команд. Большинство ЭВМ построено по <strong>архитектуре фон Неймана</strong>, главный принцип которой — хранение команд и данных в единой памяти. Её принципы: однородность памяти, адресность, программное управление, двоичное кодирование. В состав входят: процессор (ЦП = АЛУ + УУ), память, устройства ввода-вывода и шины. В <strong>гарвардской архитектуре</strong> память команд и данных разделена физически (микроконтроллеры). По набору команд различают CISC (x86) и RISC (ARM).</p>`,
remember:['Фон Нейман — главная идея: команды и данные в <strong>одной памяти</strong>','4 принципа: однородность, адресность, программное управление, двоичное кодирование','Процессор = <strong>АЛУ</strong> (считает) + <strong>УУ</strong> (управляет)','Гарвардская архитектура — <strong>раздельная</strong> память (быстрее, для микроконтроллеров)','CISC — сложные команды (x86), RISC — простые (ARM)']
},
{
id:2,cat:'swd',title:'Архитектурные паттерны: MVC, MVP, MVVM',q:'Архитектурные паттерны. MVC, MVVM, MVP.',
diagram:'<svg viewBox="0 0 460 200" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.bx{fill:#1c1f29;stroke:var(--cat);stroke-width:2}.mid{fill:var(--cat)}.t1{fill:#ece8df;font-size:15px;font-weight:600;text-anchor:middle}.t2{fill:#11110d;font-size:15px;font-weight:700;text-anchor:middle}.ts{fill:#9b978d;font-size:10.5px;text-anchor:middle}.hd{fill:var(--cat);font-size:12px;font-weight:700;text-anchor:middle;font-family:JetBrains Mono,monospace}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="var(--cat)"/></marker></defs><text class="hd" x="230" y="18">Общая схема всех трёх паттернов</text><rect class="bx" x="25" y="55" width="115" height="60" rx="10"/><text class="t1" x="82" y="82">View</text><text class="ts" x="82" y="100">что видит юзер</text><rect class="bx mid" x="172" y="55" width="116" height="60" rx="10"/><text class="t2" x="230" y="80">Посредник</text><text class="t2" x="230" y="100" style="font-size:11px">C / P / VM</text><rect class="bx" x="320" y="55" width="115" height="60" rx="10"/><text class="t1" x="377" y="82">Model</text><text class="ts" x="377" y="100">данные+логика</text><path d="M140 73 L168 73" stroke="var(--cat)" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M288 97 L144 97" stroke="var(--cat)" stroke-width="2" fill="none" marker-end="url(#a)" opacity=".55"/><path d="M288 73 L316 73" stroke="var(--cat)" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M435 97 L292 97" stroke="var(--cat)" stroke-width="2" fill="none" marker-end="url(#a)" opacity=".55"/><text class="ts" x="230" y="145">верхние стрелки — действия, нижние — ответ с данными</text><text class="hd" x="230" y="178" style="font-size:11px">MVC: Controller · MVP: Presenter · MVVM: ViewModel</text></svg><div class=\'dg-cap\'>Слева — что видит пользователь (<b>View</b>), справа — данные и логика (<b>Model</b>). Посредник между ними и есть то, чем различаются три паттерна.</div>',
teaser:'Способы разложить код программы по полочкам, чтобы в нём был порядок.',
intro:`<p><span class="q">Простыми словами.</span> Когда программист пишет большое приложение, код легко превращается в кашу, где всё перемешано и страшно что-то трогать. <strong>Архитектурный паттерн</strong> — это проверенный временем способ навести в коде порядок, разложив его «по полочкам». MVC, MVP и MVVM — три самых популярных таких способа.</p><p><span class="q">Зачем это нужно.</span> Чтобы можно было поменять <strong>внешний вид</strong> программы, не сломав её <strong>логику</strong>, и наоборот. Представь ресторан, где кухня (готовка) и зал (обслуживание гостей) разделены: повар и официант не мешают друг другу. Эти паттерны делают то же самое в коде.</p>`,
concepts:[
{t:'Model (модель)',lat:'буква M во всех трёх',plain:'Это «кухня» — часть программы, которая хранит данные и содержит бизнес-логику (правила работы). Например, в банковском приложении модель знает, сколько у вас денег и как правильно сделать перевод. Модель <strong>не знает</strong>, как её покажут на экране.',why:'Отделив данные и логику в Model, мы можем менять внешний вид программы, не трогая её «мозги».'},
{t:'View (представление)',lat:'буква V во всех трёх',plain:'Это «зал ресторана» — то, что <strong>видит пользователь</strong>: кнопки, поля, картинки, текст. View отвечает только за отображение и больше ни за что.',why:'Когда вид отделён, дизайнер может переделать интерфейс, не залезая в логику программы.'},
{t:'Посредник — главное отличие',lat:'C / P / VM',plain:'Между Model и View нужен «официант» — посредник, который их связывает. Именно <strong>в нём вся разница</strong> между тремя паттернами. В <strong>MVC</strong> это Controller, в <strong>MVP</strong> — Presenter, в <strong>MVVM</strong> — ViewModel.',why:'На экзамене главное — объяснить, чем эти посредники отличаются. Дальше — по каждому.'},
{t:'MVC → Controller (контроллер)',lat:'Model-View-Controller',plain:'<strong>Controller</strong> принимает действия пользователя (нажал кнопку), меняет модель и выбирает, какой View показать. Здесь View может сам напрямую читать данные из Model.',why:'Самый старый и распространённый паттерн, особенно в веб-сайтах (фреймворки ASP.NET, Spring, Laravel).'},
{t:'MVP → Presenter (презентер)',lat:'Model-View-Presenter',plain:'Здесь View «глупый» и вообще <strong>не знает про Model</strong>. Всё общение идёт строго через <strong>Presenter</strong>: он берёт данные из модели и сам вручную обновляет вид через специальный «контракт» (интерфейс).',why:'Так удобно <strong>тестировать</strong>: можно подсунуть презентеру фальшивый View и проверить логику. Применяется в десктопе и старом Android.'},
{t:'MVVM → ViewModel + привязка данных',lat:'Model-View-ViewModel',plain:'Главная фишка — <strong>двусторонняя привязка данных (data binding)</strong>. Ты один раз «связываешь» поле ввода с переменной в ViewModel — и дальше они синхронизируются <strong>автоматически</strong>: пользователь печатает в поле — переменная сразу меняется, и наоборот. Вручную писать «возьми значение, положи в поле» не нужно.',why:'Экономит кучу ручного кода. Применяется в современных интерфейсах: WPF (Windows), Angular, Vue.'}
],
example:`<p>Возьмём форму «изменить имя пользователя» в трёх паттернах:</p><p><strong>MVC:</strong> пользователь ввёл имя → нажал «Сохранить» → Controller получил данные → обновил Model → перерисовал страницу.</p><p><strong>MVP:</strong> View сообщает Presenter «пользователь ввёл имя» → Presenter сам обновляет Model и вручную говорит View «покажи новое имя».</p><p><strong>MVVM:</strong> поле ввода <em>заранее привязано</em> к переменной <code>viewModel.userName</code>. Пользователь печатает — переменная меняется <strong>сама</strong>, без кнопки и без кода. Это и есть data binding.</p>`,
check:{q:'В чём главное отличие MVVM от MVC и MVP?',a:'В MVVM есть <strong>двусторонняя привязка данных (data binding)</strong> — интерфейс и данные синхронизируются <strong>автоматически</strong>, без ручного кода. В MVC контроллер обновляет всё вручную по событиям, в MVP этим занимается презентер. То есть MVVM убирает рутинный код синхронизации.'},
formal:`<p><strong>Архитектурные паттерны</strong> служат для разделения бизнес-логики и интерфейса. Все они выделяют три компонента: <strong>Model</strong> (данные и логика), <strong>View</strong> (отображение) и посредник между ними; различаются именно посредником. В <strong>MVC</strong> посредник — контроллер: принимает ввод и выбирает представление. В <strong>MVP</strong> представление пассивно и связано с моделью только через презентер, что повышает тестируемость. В <strong>MVVM</strong> посредник — ViewModel, а ключевая особенность — двусторонняя привязка данных (data binding), автоматически синхронизирующая представление и данные. Применяются в WPF, Angular, Vue.</p>`,
remember:['Все три = разделение <strong>Model</strong> (данные) и <strong>View</strong> (вид)','Отличаются только посредником: <strong>C</strong>ontroller / <strong>P</strong>resenter / <strong>V</strong>iew<strong>M</strong>odel','MVC — контроллер выбирает представление (веб)','MVP — пассивный View через презентер (тестируемо)','MVVM — автоматическая <strong>привязка данных</strong> (data binding)']
},
{
id:3,cat:'web',title:'Вёрстка страниц: HTML, CSS, JS',q:'Вёрстка страниц. HTML, CSS, JS. Фреймворки.',
teaser:'Из чего сделана любая страница в интернете и кто за что отвечает.',
intro:`<p><span class="q">Простыми словами.</span> Когда ты открываешь сайт, браузер собирает его из трёх вещей. У каждой своя роль, как при постройке дома: <strong>HTML</strong> — каркас и стены (что где находится), <strong>CSS</strong> — отделка и краска (как это выглядит), <strong>JS</strong> — электрика и автоматика (что происходит, когда нажимаешь кнопку).</p><p><span class="q">Зачем три разных языка.</span> Чтобы не смешивать «что» (структура), «как выглядит» (стиль) и «как себя ведёт» (поведение). Так проще менять одно, не ломая другое.</p>`,
concepts:[
{t:'HTML',lat:'HyperText Markup Language — язык разметки гипертекста',plain:'Язык, которым задают <strong>структуру</strong> страницы с помощью «тегов». Тег — это команда в угловых скобках, например &lt;h1&gt; для заголовка, &lt;p&gt; для абзаца, &lt;img&gt; для картинки. HTML говорит: «тут заголовок, тут абзац, тут кнопка».',why:'Без HTML страницы нет вообще — это её скелет. «Семантическая вёрстка» (модное требование) — это использовать теги по смыслу (header, nav, footer), чтобы поисковики и программы для незрячих понимали структуру.'},
{t:'CSS',lat:'Cascading Style Sheets — каскадные таблицы стилей',plain:'Язык <strong>оформления</strong>: цвета, шрифты, размеры, расположение элементов. Берёт голый скелет HTML и делает его красивым.',why:'Без CSS сайт выглядел бы как чёрный текст на белом фоне из 1995 года. Ключевые понятия CSS: <strong>селекторы</strong> (кого красим), <strong>блочная модель</strong> (отступы вокруг элемента), <strong>Flexbox</strong> и <strong>Grid</strong> (как располагать элементы), <strong>медиазапросы</strong> (подстройка под размер экрана телефона).'},
{t:'JavaScript (JS)',lat:'язык программирования',plain:'Язык, который оживляет страницу — отвечает за <strong>поведение</strong>. Когда ты нажимаешь кнопку и что-то происходит без перезагрузки страницы — это JS. (К языку Java он почти не относится, название историческое.)',why:'HTML и CSS статичны — они только показывают. JS добавляет действие: реакцию на клик, загрузку данных с сервера, анимацию. Работает он через <strong>DOM</strong> — это представление страницы в виде дерева, которое JS может менять на лету.'},
{t:'Фреймворки',lat:'готовые наборы инструментов',plain:'Это «конструкторы» с готовыми деталями, чтобы не писать всё с нуля. Для JS: <strong>React, Vue, Angular</strong>. Для CSS: <strong>Bootstrap</strong> (готовые кнопки и блоки), <strong>Tailwind</strong> (мелкие классы-кирпичики).',why:'Писать большой сайт на чистом JS — долго и больно. Фреймворки дают готовые решения для типовых задач. React, например, использует «компоненты» — переиспользуемые кусочки интерфейса.'}
],
example:`<p>Разберём кнопку «Лайк» на сайте:</p><p>• <strong>HTML</strong> создаёт саму кнопку: <code>&lt;button&gt;♥ 0&lt;/button&gt;</code> — это скелет.<br>• <strong>CSS</strong> красит её в красный, скругляет углы, задаёт размер — это вид.<br>• <strong>JS</strong> ловит нажатие и увеличивает счётчик с 0 на 1 без перезагрузки страницы — это поведение.</p><p>Три языка, три роли, одна кнопка.</p>`,
check:{q:'За что отвечает каждый из трёх — HTML, CSS, JS?',a:'<strong>HTML</strong> — структура и содержание (что на странице есть). <strong>CSS</strong> — оформление (как это выглядит: цвета, шрифты, расположение). <strong>JS</strong> — поведение (что происходит при действиях пользователя). Аналогия с домом: каркас, отделка, электрика.'},
formal:`<p><strong>Вёрстка</strong> — создание структуры, оформления и поведения веб-страницы. <strong>HTML</strong> — язык разметки, задающий структуру и семантику документа тегами. <strong>CSS</strong> — язык стилей; основные понятия: селекторы, блочная модель, раскладки Flexbox (одномерная) и Grid (двумерная), медиазапросы для адаптивности. <strong>JavaScript</strong> обеспечивает интерактивность: работу с DOM (деревом страницы), обработку событий и обмен с сервером. Применяются фреймворки: React, Vue, Angular (JS), Bootstrap и Tailwind (CSS).</p>`,
remember:['<strong>HTML</strong> — структура (теги, скелет)','<strong>CSS</strong> — оформление (box model, Flexbox, Grid)','<strong>JS</strong> — поведение (DOM, события, реакция на клики)','<strong>DOM</strong> — представление страницы в виде дерева, его меняет JS','Фреймворки: React/Vue/Angular (JS), Bootstrap/Tailwind (CSS)']
},

id:4,cat:'alg',title:'Деревья',q:'Деревья. Основные определения, виды деревьев, поиск в деревьях.',
diagram:'<svg viewBox="0 0 440 250" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.nd{fill:#1c1f29;stroke:var(--cat);stroke-width:2}.root{fill:var(--cat)}.tx{fill:#ece8df;font-size:15px;font-weight:600;text-anchor:middle}.rt{fill:#11110d;font-size:15px;font-weight:700;text-anchor:middle}.ln{stroke:var(--cat);stroke-width:2;opacity:.5}.lb{fill:#9b978d;font-size:11px;text-anchor:middle;font-family:JetBrains Mono,monospace}.path{stroke:var(--cat);stroke-width:3}</style><line class="path" x1="220" y1="46" x2="120" y2="106"/><line class="ln" x1="220" y1="46" x2="320" y2="106"/><line class="ln" x1="120" y1="126" x2="60" y2="186"/><line class="path" x1="120" y1="126" x2="180" y2="186"/><line class="ln" x1="320" y1="126" x2="270" y2="186"/><line class="ln" x1="320" y1="126" x2="380" y2="186"/><circle class="nd root" cx="220" cy="36" r="22"/><text class="rt" x="220" y="42">10</text><circle class="nd" cx="120" cy="116" r="22"/><text class="tx" x="120" y="122">5</text><circle class="nd" cx="320" cy="116" r="22"/><text class="tx" x="320" y="122">15</text><circle class="nd" cx="60" cy="196" r="22"/><text class="tx" x="60" y="202">3</text><circle class="nd" cx="180" cy="196" r="22" fill="var(--cat)"/><text class="rt" x="180" y="202">7</text><circle class="nd" cx="270" cy="196" r="22"/><text class="tx" x="270" y="202">12</text><circle class="nd" cx="380" cy="196" r="22"/><text class="tx" x="380" y="202">18</text><text class="lb" x="120" y="20">корень</text><text class="lb" x="50" y="84">меньше ←</text><text class="lb" x="392" y="84">→ больше</text></svg><div class=\'dg-cap\'>Поиск числа <b>7</b> (жирный путь): в корне 10 → 7&lt;10, влево к 5 → 7&gt;5, вправо → нашли. Слева всегда меньше, справа больше.</div>',
teaser:'Способ хранить данные в виде иерархии, чтобы быстро в них искать.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Дерево</strong> в программировании — это способ хранить данные в виде иерархии, ветвящейся структуры. Самый понятный пример — папки на компьютере: есть главная папка, в ней вложенные, в них ещё вложенные.</p><p><span class="q">Почему «дерево» и зачем оно.</span> Структура похожа на дерево, только перевёрнутое: <strong>корень</strong> сверху, ветки растут вниз. Главная польза — в правильно построенном дереве можно <strong>очень быстро искать</strong>: как слово в словаре, отбрасывая половину за шаг.</p>`,
concepts:[
{t:'Узел, корень, лист',lat:'базовые слова',plain:'<strong>Узел</strong> — один элемент дерева (одна «коробочка» с данными). <strong>Корень</strong> — самый верхний узел, с него всё начинается (как папка C:). <strong>Лист</strong> — узел без потомков, тупик (как пустая папка).',why:'Это базовый словарь — без него не получится говорить про деревья. Их почти всегда просят определить.'},
{t:'Высота и глубина',lat:'',plain:'<strong>Глубина узла</strong> — сколько шагов от корня до него. <strong>Высота дерева</strong> — глубина самого нижнего листа, то есть «насколько дерево вытянуто вниз».',why:'От высоты зависит скорость поиска: чем дерево «ниже и шире», тем быстрее находим (меньше шагов).'},
{t:'Бинарное дерево поиска (BST)',lat:'BST = Binary Search Tree',plain:'Особое дерево, где у каждого узла не больше двух потомков, и действует правило: <strong>слева числа меньше узла, справа — больше</strong>. Благодаря этому поиск идёт как в словаре: сравнил с узлом → пошёл влево или вправо → отбросил половину дерева.',why:'Это даёт скорость поиска <strong>O(log n)</strong> — очень быстро. Но есть подвох: если добавлять уже отсортированные числа, дерево вырождается в «палку» (просто список), и поиск замедляется до <strong>O(n)</strong>.'},
{t:'Сбалансированные деревья',lat:'AVL, красно-чёрное',plain:'Чтобы дерево не выродилось в «палку», придумали деревья, которые сами себя выравнивают при добавлении элементов: <strong>AVL</strong> (строгий контроль) и <strong>красно-чёрное</strong> (помягче).',why:'Они гарантируют быстрый поиск O(log n) всегда. Красно-чёрные деревья используются внутри стандартных структур многих языков (map, set).'},
{t:'B-деревья и куча',lat:'',plain:'<strong>B-дерево</strong> — дерево, где у узла много потомков; используется в базах данных и файловых системах. <strong>Куча (heap)</strong> — дерево для быстрого получения минимума или максимума.',why:'B-деревья делают мало обращений к диску (это медленно), поэтому идеальны для СУБД. Куча нужна для «очереди с приоритетом».'},
{t:'Обходы дерева',lat:'DFS и BFS',plain:'Способы пройти все узлы. <strong>В глубину (DFS)</strong> — идём вглубь по ветке до конца, потом возвращаемся (бывает прямой, симметричный, обратный). <strong>В ширину (BFS)</strong> — идём по уровням, слой за слоем.',why:'Важный факт для билета: <strong>симметричный обход BST выдаёт элементы по порядку</strong> (отсортированными) — это любят спрашивать.'}
],
example:`<p>Ищем число <strong>7</strong> в дереве поиска (BST). В корне стоит 10:</p><p>1. 7 меньше 10 → идём <strong>влево</strong>.<br>2. Слева узел 5. 7 больше 5 → идём <strong>вправо</strong>.<br>3. Справа узел 7 → нашли!</p><p>Три шага вместо перебора всех элементов. Если бы в дереве была тысяча чисел, мы бы нашли за ~10 шагов, а не за 1000. Вот сила O(log n).</p>`,
check:{q:'Почему поиск в BST обычно быстрый, но иногда медленный?',a:'Обычно быстрый — <strong>O(log n)</strong>, потому что на каждом шаге отбрасываем половину дерева (слева меньше, справа больше). Но если вставлять уже отсортированные данные, дерево вырождается в «палку» (список), и поиск замедляется до <strong>O(n)</strong>. Чтобы этого избежать, используют сбалансированные деревья (AVL, красно-чёрное).'},
formal:`<p><strong>Дерево</strong> — связный ациклический граф, представляющий иерархию. Узел без родителя — корень, без потомков — лист; высота — максимальная глубина узлов. <strong>Бинарное дерево поиска (BST)</strong>: слева значения меньше узла, справа больше, поэтому поиск отбрасывает половину — O(log n) в среднем, O(n) в худшем (при вырождении). Поэтому применяют сбалансированные деревья: AVL и красно-чёрное. B-деревья используют в СУБД, кучу — для очереди с приоритетом. Обходы: в глубину (прямой, симметричный, обратный) и в ширину; симметричный обход BST даёт отсортированную последовательность.</p>`,
remember:['Дерево — иерархия: <strong>корень</strong> сверху, <strong>листья</strong> внизу','<strong>BST</strong>: слева меньше, справа больше → поиск O(log n)','В худшем случае (вырождение) поиск O(n) → спасают <strong>AVL</strong> и красно-чёрные','<strong>B-деревья</strong> — для баз данных','Симметричный обход BST = отсортированный список']
},
{
id:5,cat:'sec',title:'Шифрование. Симметричное, асимметричное, RSA',q:'Информационная безопасность. Асимметричное и симметричное шифрование. RSA.',
teaser:'Как сделать сообщение нечитаемым для посторонних — и два разных подхода к этому.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Шифрование</strong> — превращение понятного текста в нечитаемую тарабарщину, чтобы посторонние не прочитали. Тот, кому надо, превращает обратно с помощью «ключа».</p><p><span class="q">Зачем это нужно.</span> Чтобы пароли, переписку и платежи в интернете нельзя было подсмотреть. Каждый раз, когда видишь «замочек» в адресной строке браузера — это работает шифрование.</p>`,
concepts:[
{t:'Симметричное шифрование',lat:'один ключ',plain:'Используется <strong>один и тот же ключ</strong> и чтобы зашифровать, и чтобы расшифровать — как обычный ключ от двери, которым и запираешь, и открываешь.',why:'Оно быстрое и хорошо для больших объёмов. Но есть проблема: как передать копию ключа собеседнику, чтобы её не перехватили по дороге? Это «проблема передачи ключа». Алгоритмы: <strong>AES</strong> (современный стандарт), DES (устаревший).'},
{t:'Асимметричное шифрование',lat:'два ключа',plain:'Хитрее: есть <strong>два разных, но связанных ключа</strong>. Один — <strong>открытый</strong>, его можно дать кому угодно; им можно только <em>зашифровать</em>. Второй — <strong>закрытый</strong>, его держишь только у себя; только им можно <em>расшифровать</em>.',why:'Это решает проблему передачи ключа: открытый ключ не страшно показывать всем. Минус — работает медленнее. Поэтому на практике используют гибрид: асимметрией безопасно передают симметричный ключ, а дальше быстро шифруют симметрично (так устроен HTTPS).'},
{t:'Аналогия с почтовым ящиком',lat:'чтобы понять асимметрию',plain:'Представь почтовый ящик с щелью. <strong>Бросить письмо</strong> (зашифровать) может любой — щель открыта всем, это «открытый ключ». А <strong>достать письма</strong> (расшифровать) может только хозяин ключом от дверцы — это «закрытый ключ».',why:'Эта аналогия отлично заходит на экзамене и показывает, что ты понял суть, а не зазубрил.'},
{t:'RSA',lat:'по фамилиям создателей: Rivest, Shamir, Adleman',plain:'Самый известный алгоритм асимметричного шифрования. Его надёжность основана на том, что <strong>перемножить два больших простых числа легко, а разложить результат обратно на множители — практически невозможно</strong> даже для мощного компьютера.',why:'В билете просят знать, как генерируются ключи RSA — это разбираем в примере по шагам.'},
{t:'ЭЦП — электронная подпись',lat:'',plain:'Обратное применение RSA: чтобы доказать, что сообщение от тебя, ты «подписываешь» его <strong>закрытым</strong> ключом, а любой может проверить подпись <strong>открытым</strong> ключом.',why:'Так работают электронные документы и подтверждение личности в интернете. Стоит упомянуть в ответе как применение асимметрии.'}
],
example:`<p>Сгенерируем ключи RSA на маленьких числах (на экзамене числа огромные, но принцип тот же):</p><pre>1. Берём 2 простых числа:  p=3, q=11
2. Считаем модуль:         n = p·q = 33
3. Функция Эйлера:         φ = (p−1)(q−1) = 2·10 = 20
4. Открытая экспонента e:  берём 7 (взаимно простое с 20)
5. Закрытая экспонента d:  такое, что e·d mod φ = 1
                            7·3 = 21, 21 mod 20 = 1 → d=3</pre><p>Открытый ключ — <strong>(e=7, n=33)</strong>, закрытый — <strong>(d=3, n=33)</strong>.</p><p>Зашифруем число M=2:  <strong>C = 2⁷ mod 33 = 128 mod 33 = 29</strong>.<br>Расшифруем:  <strong>M = 29³ mod 33 = 24389 mod 33 = 2</strong>. Получили обратно исходное число!</p>`,
check:{q:'Зачем нужна асимметрия, если симметричное шифрование быстрее?',a:'Симметричное быстрое, но у него <strong>проблема передачи ключа</strong>: как переслать секретный ключ собеседнику, чтобы его не перехватили? Асимметрия это решает — открытый ключ <strong>не страшно</strong> показывать всем (им можно только зашифровать), а расшифровать сможет только владелец закрытого ключа. На практике их комбинируют: асимметрией передают симметричный ключ.'},
formal:`<p>Различают симметричное и асимметричное шифрование. <strong>Симметричное</strong> использует один секретный ключ (AES, DES) — быстро, но есть проблема передачи ключа. <strong>Асимметричное</strong> использует пару ключей: открытый и закрытый; зашифрованное открытым расшифровывается только закрытым, что решает проблему передачи. <strong>RSA</strong> основан на сложности факторизации больших чисел. Ключи: берут простые p и q; n = p·q; φ(n) = (p−1)(q−1); выбирают e, взаимно простое с φ; находят d, где e·d ≡ 1 (mod φ). Открытый ключ (e, n), закрытый (d, n). Шифрование C = Mᵉ mod n, расшифровка M = Cᵈ mod n. На асимметрии строится ЭЦП.</p>`,
remember:['<strong>Симметричное</strong> — один ключ (AES), быстро, но проблема передачи ключа','<strong>Асимметричное</strong> — открытый/закрытый ключ (RSA), решает проблему передачи','RSA: n=p·q, φ=(p−1)(q−1), e·d ≡ 1 (mod φ)','Шифрование C = Mᵉ mod n, расшифровка M = Cᵈ mod n','<strong>ЭЦП</strong> — подпись закрытым ключом, проверка открытым']
},
{
id:6,cat:'sys',title:'Жизненный цикл информационных систем',q:'Жизненный цикл ИС. Этапы и стадии жизненного цикла ИС.',
teaser:'Все этапы, которые проходит программа от идеи до списания.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Информационная система (ИС)</strong> — любая программа для работы с информацией: сайт магазина, банковское приложение, электронный дневник. <strong>Жизненный цикл</strong> — это все этапы, которые она проходит «от рождения до смерти».</p><p><span class="q">Зачем это знать.</span> Систему нельзя просто «взять и написать». Сначала надо понять, что нужно, потом спроектировать, сделать, проверить, запустить, поддерживать, а когда устареет — заменить. Знание этапов помогает ничего не упустить.</p>`,
concepts:[
{t:'Что такое стадия жизненного цикла',lat:'',plain:'Это один крупный этап в «жизни» системы. Их проходят по порядку. Аналогия — постройка дома: сначала узнаёшь, что хочет хозяин, потом чертёж, потом стройка, и так далее.',why:'В билете обычно просят перечислить стадии по порядку — это основа ответа.'},
{t:'Анализ требований',lat:'1-я стадия',plain:'Выясняем, <strong>что вообще нужно</strong>. Изучаем заказчика, его задачи, собираем требования к будущей системе.',why:'Если ошибиться здесь, всё остальное будет напрасным — построим не то. Это как выяснить у хозяина дома, сколько ему нужно комнат.'},
{t:'Проектирование',lat:'2-я стадия',plain:'Продумываем, <strong>как это устроим</strong>: архитектуру системы, структуру базы данных, как будут выглядеть экраны. Это «чертёж» до начала разработки.',why:'Хороший проект экономит силы на следующих этапах. Идёт от общего к частному (концептуальный → логический → физический).'},
{t:'Реализация и тестирование',lat:'3-4 стадии',plain:'<strong>Реализация</strong> — программисты пишут код. <strong>Тестирование</strong> — ищут и исправляют ошибки, проверяют, что всё работает как задумано.',why:'Это собственно «стройка» и «проверка качества».'},
{t:'Внедрение и сопровождение',lat:'5-6 стадии',plain:'<strong>Внедрение</strong> — устанавливаем систему у заказчика, обучаем людей пользоваться. <strong>Сопровождение</strong> — поддерживаем работу, исправляем всплывшие ошибки, дорабатываем. Это <strong>самая долгая</strong> стадия.',why:'Многие думают, что после запуска работа закончена, но сопровождение длится годами — это важно подчеркнуть.'},
{t:'Модели жизненного цикла',lat:'как именно проходим стадии',plain:'<strong>Каскадная</strong> — строго по порядку, без возврата назад. <strong>Итерационная</strong> — делаем по частям, можем возвращаться и дорабатывать. <strong>Спиральная</strong> — на каждом витке отдельно оцениваем риски.',why:'Стандарт, который всё это регламентирует — <strong>ISO/IEC 12207</strong>. Стоит назвать его для солидности ответа.'}
],
example:`<p>Электронный дневник для школы по стадиям:</p><p>1. <strong>Анализ:</strong> выясняем у учителей и родителей, что им нужно.<br>2. <strong>Проектирование:</strong> рисуем структуру базы (ученики, оценки) и экраны.<br>3. <strong>Реализация:</strong> программисты пишут дневник.<br>4. <strong>Тестирование:</strong> проверяем на одной школе, ловим баги.<br>5. <strong>Внедрение:</strong> запускаем на весь регион, обучаем учителей.<br>6. <strong>Сопровождение:</strong> годами поддерживаем и добавляем функции.</p>`,
check:{q:'Назови стадии жизненного цикла ИС по порядку.',a:'Анализ требований → проектирование → реализация → тестирование → внедрение → эксплуатация и сопровождение → вывод из эксплуатации. Регламентируется стандартом <strong>ISO/IEC 12207</strong>.'},
formal:`<p><strong>Жизненный цикл ИС</strong> — период от возникновения потребности в системе до её вывода из эксплуатации (стандарт ISO/IEC 12207). Основные стадии: анализ требований, проектирование, реализация, тестирование, внедрение, эксплуатация и сопровождение, вывод из эксплуатации. Существуют модели жизненного цикла: <strong>каскадная</strong> (последовательное прохождение этапов без возврата), <strong>итерационная</strong> (разработка по частям с возвратами) и <strong>спиральная</strong> (с анализом рисков на каждом витке).</p>`,
remember:['ЖЦ = от потребности до вывода из эксплуатации','Стадии: анализ → проектирование → реализация → тестирование → внедрение → сопровождение → вывод','Сопровождение — <strong>самая долгая</strong> стадия','Модели: каскадная, итерационная, спиральная (риски)','Стандарт — <strong>ISO/IEC 12207</strong>']
},
{
id:7,cat:'ml',title:'Машинное обучение',q:'Машинное обучение. Решаемые задачи, виды машинного обучения. Основные понятия.',
teaser:'Как компьютер учится сам на примерах, а не по жёстким правилам.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Машинное обучение</strong> — это когда компьютер учится сам, на примерах, а не по заранее прописанным правилам. Ему не говорят «делай так», а показывают много примеров, и он сам находит закономерность.</p><p><span class="q">Разница с обычной программой.</span> Обычная: программист пишет правило «если в письме есть слово „выигрыш“ — это спам». Машинное обучение: показываем 10 000 писем с пометками «спам / не спам», и компьютер сам учится отличать — даже то, что не предусмотрели правилами.</p>`,
concepts:[
{t:'Модель',lat:'главное слово темы',plain:'Это та самая «обученная штука», которая после обучения умеет давать ответы на новых данных. Сначала модель «учат» на примерах, потом она работает.',why:'Когда говорят «обучить модель» — имеют в виду именно настройку этого механизма на данных.'},
{t:'Обучение с учителем',lat:'supervised learning',plain:'Учим на <strong>размеченных</strong> данных — где для каждого примера есть правильный ответ. Решает две задачи: <strong>классификация</strong> (предсказать категорию: спам или нет, кошка или собака) и <strong>регрессия</strong> (предсказать число: цену квартиры, температуру).',why:'«С учителем» — потому что есть «правильные ответы», как учитель, который проверяет. Самый распространённый вид.'},
{t:'Обучение без учителя',lat:'unsupervised learning',plain:'Данные <strong>без правильных ответов</strong> — модель сама ищет в них структуру. Главная задача: <strong>кластеризация</strong> — разбить объекты на группы похожих (например, сегменты клиентов магазина).',why:'«Без учителя» — потому что никто не говорит, какой ответ правильный. Полезно, когда размечать данные дорого или непонятно как.'},
{t:'Обучение с подкреплением',lat:'reinforcement learning',plain:'Агент (например, бот в игре) совершает действия и получает <strong>награду или штраф</strong>. Методом проб и ошибок он учится действовать так, чтобы награда была максимальной.',why:'Так обучают игровых ботов и роботов ходить. Аналогия — дрессировка: за правильное действие лакомство, за неправильное — нет.'},
{t:'Признаки и целевая переменная',lat:'features и target',plain:'<strong>Признаки</strong> — характеристики объекта (для квартиры: площадь, этаж, район). <strong>Целевая переменная</strong> — то, что предсказываем (цена). Данные делят на <strong>обучающую</strong> выборку (на ней учимся) и <strong>тестовую</strong> (на ней честно проверяем).',why:'Это базовый словарь ML — без него не обойтись в ответе.'},
{t:'Переобучение',lat:'overfitting — главная проблема',plain:'Когда модель <strong>«вызубрила»</strong> обучающие данные наизусть, но плохо работает на новых. Как студент, который выучил ответы на конкретные билеты, но не понял предмет.',why:'Главная беда в ML, которую все боятся. Поэтому и проверяют модель на отдельной тестовой выборке — чтобы поймать переобучение.'}
],
example:`<p>Задача: предсказать <strong>цену квартиры</strong> (это регрессия, обучение с учителем).</p><p>1. Даём модели 5000 объявлений: для каждого известны <strong>признаки</strong> (площадь, район, этаж) и реальная <strong>цена</strong>.<br>2. Модель находит закономерность: как цена зависит от признаков.<br>3. Теперь по новой квартире (которую модель не видела) она предсказывает цену.</p><p>Если модель идеально «помнит» обучающие квартиры, но мажет на новых — это <strong>переобучение</strong>.</p>`,
check:{q:'Чем отличается обучение с учителем от обучения без учителя?',a:'<strong>С учителем</strong> — данные размечены, есть правильные ответы; решает классификацию (категория) и регрессию (число). <strong>Без учителя</strong> — данных с ответами нет, модель сама ищет структуру; основная задача — кластеризация (разбиение на группы похожих).'},
formal:`<p><strong>Машинное обучение</strong> — раздел искусственного интеллекта, изучающий алгоритмы, которые обучаются на данных без явного программирования правил. Виды: <strong>обучение с учителем</strong> (на размеченных данных; задачи классификации и регрессии); <strong>обучение без учителя</strong> (на неразмеченных; кластеризация и понижение размерности); <strong>обучение с подкреплением</strong> (агент учится через вознаграждение и штраф). Основные понятия: признаки, целевая переменная, обучающая и тестовая выборки. Ключевая проблема — переобучение, когда модель не обобщается на новые данные.</p>`,
remember:['<strong>С учителем</strong> — есть ответы; классификация (категория) и регрессия (число)','<strong>Без учителя</strong> — нет ответов; кластеризация (группы)','<strong>С подкреплением</strong> — награда/штраф (игры, роботы)','Понятия: признаки, целевая переменная, train/test выборки','Главная проблема — <strong>переобучение</strong> (модель не обобщается)']
},
{
id:8,cat:'sys',title:'Методологии разработки ПО',q:'Методологии разработки ПО. Виды и графическое отображение.',
diagram:'<svg viewBox="0 0 440 240" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.bx{fill:#1c1f29;stroke:var(--cat);stroke-width:2;rx:8}.t1{fill:#ece8df;font-size:12px;text-anchor:middle}.ln{stroke:var(--cat);stroke-width:2;opacity:.4;stroke-dasharray:4}.hd{fill:var(--cat);font-size:11px;text-anchor:middle;font-family:JetBrains Mono,monospace}</style><text class="hd" x="80" y="20">разработка ↓</text><text class="hd" x="370" y="20">↑ тестирование</text><rect class="bx" x="20" y="32" width="120" height="30" rx="8"/><text class="t1" x="80" y="52">Требования</text><rect class="bx" x="55" y="80" width="120" height="30" rx="8"/><text class="t1" x="115" y="100">Проектирование</text><rect class="bx" x="90" y="128" width="120" height="30" rx="8"/><text class="t1" x="150" y="148">Детали</text><rect class="bx" x="160" y="180" width="110" height="30" rx="8" fill="var(--cat)"/><text class="t1" x="215" y="200" style="fill:#11110d;font-weight:700">Кодирование</text><rect class="bx" x="300" y="32" width="120" height="30" rx="8"/><text class="t1" x="360" y="52">Приёмочное</text><rect class="bx" x="265" y="80" width="120" height="30" rx="8"/><text class="t1" x="325" y="100">Системное</text><rect class="bx" x="230" y="128" width="120" height="30" rx="8"/><text class="t1" x="290" y="148">Модульное</text><line class="ln" x1="140" y1="47" x2="300" y2="47"/><line class="ln" x1="175" y1="95" x2="265" y2="95"/><line class="ln" x1="210" y1="143" x2="230" y2="143"/></svg><div class=\'dg-cap\'>V-модель: слева спускаемся (требования → код), справа поднимаемся (тестирование). Пунктир — каждому этапу проектирования соответствует свой уровень проверки.</div>',
teaser:'«Рецепты» того, как команда движется от идеи к готовой программе.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Методология разработки</strong> — это «рецепт» того, как команда организует работу над программой: в каком порядке что делать, как двигаться от идеи к продукту.</p><p><span class="q">Зачем это нужно.</span> Большую программу делает много людей. Без общего плана — хаос: кто-то делает не то, ошибки находят поздно, сроки горят. Методология задаёт правила игры. Главный выбор — между «всё спланировать заранее» и «двигаться гибко маленькими шагами».</p>`,
concepts:[
{t:'Каскадная модель (водопад)',lat:'Waterfall',plain:'Этапы идут строго по очереди: требования → проектирование → разработка → тестирование. Назад не возвращаемся, как вода в водопаде течёт только вниз.',why:'Просто и предсказуемо, когда всё известно заранее. Минус: ошибку в требованиях замечаешь только в самом конце — дорого исправлять. <strong>Рисуют ступенями, спускающимися вниз.</strong>'},
{t:'V-образная модель',lat:'V-model',plain:'Тот же каскад, но «сложенный» буквой V. Левая сторона — спуск (требования, проектирование, код), правая — подъём (тестирование). Каждому этапу проектирования слева соответствует свой этап проверки справа.',why:'Делает акцент на тестировании — для каждого уровня разработки заранее планируют, как его проверять. <strong>Рисуют буквой V.</strong>'},
{t:'Итерационная модель',lat:'инкрементная',plain:'Продукт делают <strong>по частям</strong> (итерациями), каждая часть проходит мини-цикл. Можно показать заказчику ранний результат и скорректироваться.',why:'Гибче водопада — не нужно ждать конца, чтобы что-то увидеть. <strong>Рисуют повторяющимися циклами.</strong>'},
{t:'Спиральная модель',lat:'модель Боэма',plain:'Разработка идёт витками спирали, и на каждом витке <strong>отдельно анализируют риски</strong> — что может пойти не так.',why:'Для крупных, дорогих и рискованных проектов, где ошибка стоит больших денег. <strong>Рисуют раскручивающейся спиралью.</strong>'},
{t:'Гибкие методологии (Agile)',lat:'',plain:'Очень короткие итерации, постоянная обратная связь с заказчиком, готовность менять требования по ходу.',why:'Самый современный подход. Подробно разбирается в вопросе 9 (Scrum, Канбан).'}
],
example:`<p>Запуск сайта банка двумя способами:</p><p><strong>По каскаду:</strong> полгода собираем все требования, потом полгода пишем, в конце тестируем — и узнаём, что за это время бизнес передумал. Переделывать дорого.</p><p><strong>По Agile:</strong> за 2 недели делаем минимальную рабочую версию, показываем заказчику, получаем замечания, корректируем — и так раз за разом. Ошибки видны сразу.</p>`,
check:{q:'Как графически изображают каскадную, V-модель и спиральную?',a:'<strong>Каскадная</strong> — ступенями, спускающимися вниз (как водопад). <strong>V-модель</strong> — буквой V: слева спуск (проектирование), справа подъём (тестирование). <strong>Спиральная</strong> — раскручивающейся спиралью, где каждый виток включает анализ рисков.'},
formal:`<p><strong>Методология разработки</strong> — принципы организации процесса создания ПО. <strong>Каскадная модель</strong> — последовательное выполнение этапов без возврата (изображается ступенями вниз); ошибка видна поздно. <strong>V-модель</strong> — каскад в форме буквы V, где каждому этапу проектирования соответствует этап тестирования. <strong>Итерационная</strong> — разработка приращениями (повторяющиеся циклы). <strong>Спиральная</strong> — витки спирали с анализом рисков. <strong>Гибкие (Agile)</strong> — короткие итерации с обратной связью.</p>`,
remember:['<strong>Каскад</strong> — строго по очереди, ступени вниз; ошибка видна поздно','<strong>V-модель</strong> — буква V, упор на тестирование','<strong>Итерационная</strong> — по частям, повторяющиеся циклы','<strong>Спиральная</strong> — витки + анализ рисков','<strong>Agile</strong> — короткие итерации, гибкость']
},
{
id:9,cat:'sys',title:'Управление проектами: Agile, Scrum, Канбан',q:'Методологии управления проектами. Agile, Scrum, Канбан.',
teaser:'Как организовать работу команды: философия и два конкретных способа.',
intro:`<p><span class="q">Простыми словами.</span> Если вопрос 8 — про то, <em>как пишут код</em>, то этот — про то, <em>как люди в команде договариваются и распределяют задачи</em>.</p><p><span class="q">Связь между понятиями.</span> <strong>Agile</strong> — это общая философия («работай гибко, маленькими шагами»). А <strong>Scrum</strong> и <strong>Канбан</strong> — два конкретных способа воплотить эту философию на практике.</p>`,
concepts:[
{t:'Agile',lat:'англ. «гибкий, шустрый»',plain:'Это не конкретный метод, а <strong>философия/подход</strong>. Изложена в «Манифесте гибкой разработки» (2001 г.). Главные ценности: люди важнее процессов, работающий продукт важнее документации, сотрудничество с заказчиком важнее жёсткого контракта, готовность к изменениям важнее плана.',why:'Раньше всё планировали на год вперёд и часто делали не то. Agile предложил двигаться короткими отрезками и постоянно сверяться с заказчиком. Scrum и Канбан — его реализации.'},
{t:'Scrum — спринты',lat:'из регби: «схватка»',plain:'Способ работы короткими отрезками — <strong>спринтами</strong> (обычно 1–4 недели). За спринт команда берёт набор задач и доводит их до готового результата.',why:'Короткий спринт = частая проверка и быстрая реакция на изменения. Это основа Scrum.'},
{t:'Scrum — роли',lat:'кто за что отвечает',plain:'<strong>Product Owner</strong> (владелец продукта) — решает, ЧТО делать, ведёт список задач. <strong>Scrum Master</strong> — следит, чтобы процесс работал, убирает помехи команде. <strong>Команда</strong> — собственно делает работу.',why:'Эти три роли почти всегда просят назвать в ответе про Scrum.'},
{t:'Scrum — артефакты и церемонии',lat:'',plain:'<strong>Артефакты:</strong> бэклог продукта (весь список задач), бэклог спринта (задачи на текущий спринт), инкремент (готовый результат). <strong>Церемонии:</strong> планирование, ежедневный 15-минутный «стендап» (daily), обзор итогов, ретроспектива (что улучшить).',why:'Показывает, что ты знаешь, как Scrum устроен изнутри.'},
{t:'Канбан',lat:'яп. «карточка, доска»',plain:'Другой способ — <strong>непрерывный поток</strong> без жёстких спринтов. Главное — <strong>доска</strong> со столбцами «Сделать → В работе → Готово» и <strong>WIP-лимит</strong> — ограничение, сколько задач можно делать одновременно.',why:'WIP-лимит — ключевая фишка: он не даёт хвататься за всё сразу и заставляет доводить задачи до конца. Сравни: Scrum работает спринтами, Канбан — непрерывным потоком.'}
],
example:`<p><strong>Scrum:</strong> команда на 2 недели берёт 8 задач. Каждое утро — 15-минутный стендап «что сделал, что буду делать, что мешает». В конце спринта показывают готовый функционал.</p><p><strong>Канбан:</strong> задачи постоянно «текут» по доске слева направо. Действует правило «не больше 3 задач в работе одновременно» — пока не доведёшь одну до «Готово», новую брать нельзя.</p>`,
check:{q:'Чем Scrum отличается от Канбана?',a:'<strong>Scrum</strong> работает фиксированными <strong>спринтами</strong> (1–4 недели) с ролями (Product Owner, Scrum Master, команда) и церемониями. <strong>Канбан</strong> — это непрерывный <strong>поток</strong> без спринтов, с доской и WIP-лимитом (ограничением числа задач в работе). Scrum — итерациями, Канбан — потоком.'},
formal:`<p><strong>Agile</strong> — группа гибких методологий на основе Манифеста 2001 г.: приоритет людей над процессами, продукта над документацией, готовности к изменениям. Реализации — Scrum и Канбан. <strong>Scrum</strong> организует работу спринтами (1–4 недели); роли: владелец продукта, скрам-мастер, команда; артефакты: бэклог продукта, бэклог спринта, инкремент; мероприятия: планирование, дейли, обзор, ретроспектива. <strong>Канбан</strong> основан на доске и ограничении числа задач в работе (WIP-лимит), реализуя непрерывный поток без итераций.</p>`,
remember:['<strong>Agile</strong> — философия (манифест 2001 г.), а Scrum и Канбан — её реализации','<strong>Scrum</strong> — спринты (1–4 нед) + роли (PO, SM, команда) + церемонии','Роли Scrum: <strong>Product Owner</strong> (что делать), <strong>Scrum Master</strong> (процесс), команда','<strong>Канбан</strong> — доска + WIP-лимит (ограничение задач в работе)','Scrum — итерациями, Канбан — непрерывным потоком']
},
{
id:10,cat:'web',title:'Сети. Интернет. TCP/IP и OSI',q:'Основные понятия сетей. Сеть Интернет. Модель TCP/IP, OSI.',
diagram:'<svg viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.osi{fill:#1c1f29;stroke:var(--cat);stroke-width:1.5}.tcp{fill:var(--cat);opacity:.92}.t1{fill:#ece8df;font-size:12.5px;text-anchor:middle}.t2{fill:#11110d;font-size:12.5px;font-weight:600;text-anchor:middle}.hd{fill:var(--cat);font-size:12px;font-weight:700;text-anchor:middle;font-family:JetBrains Mono,monospace}.nm{fill:#9b978d;font-size:10px;text-anchor:middle}</style><text class="hd" x="120" y="20">OSI — 7 уровней</text><text class="hd" x="340" y="20">TCP/IP — 4</text><rect class="osi" x="30" y="32" width="180" height="32"/><text class="t1" x="120" y="52">7. Прикладной</text><rect class="osi" x="30" y="66" width="180" height="32"/><text class="t1" x="120" y="86">6. Представления</text><rect class="osi" x="30" y="100" width="180" height="32"/><text class="t1" x="120" y="120">5. Сеансовый</text><rect class="osi" x="30" y="134" width="180" height="32"/><text class="t1" x="120" y="154">4. Транспортный</text><rect class="osi" x="30" y="168" width="180" height="32"/><text class="t1" x="120" y="188">3. Сетевой (IP)</text><rect class="osi" x="30" y="202" width="180" height="32"/><text class="t1" x="120" y="222">2. Канальный</text><rect class="osi" x="30" y="236" width="180" height="32"/><text class="t1" x="120" y="256">1. Физический</text><rect class="tcp" x="260" y="32" width="160" height="66" rx="6"/><text class="t2" x="340" y="70">Прикладной</text><rect class="tcp" x="260" y="134" width="160" height="32" rx="6"/><text class="t2" x="340" y="154">Транспортный</text><rect class="tcp" x="260" y="168" width="160" height="32" rx="6"/><text class="t2" x="340" y="188">Межсетевой (IP)</text><rect class="tcp" x="260" y="202" width="160" height="66" rx="6"/><text class="t2" x="340" y="240">Канальный</text><line x1="210" y1="65" x2="260" y2="65" stroke="var(--cat)" stroke-width="1" opacity=".4" stroke-dasharray="3"/><line x1="210" y1="150" x2="260" y2="150" stroke="var(--cat)" stroke-width="1" opacity=".4" stroke-dasharray="3"/><line x1="210" y1="184" x2="260" y2="184" stroke="var(--cat)" stroke-width="1" opacity=".4" stroke-dasharray="3"/><line x1="210" y1="235" x2="260" y2="235" stroke="var(--cat)" stroke-width="1" opacity=".4" stroke-dasharray="3"/></svg><div class=\'dg-cap\'>TCP/IP — это «сжатая» версия OSI: 4 уровня вместо 7. Верхние три уровня OSI собраны в один прикладной, нижние два — в канальный.</div>',
teaser:'Как компьютеры по всему миру договариваются и обмениваются данными.',
intro:`<p><span class="q">Простыми словами.</span> Чтобы два компьютера на разных концах планеты поняли друг друга, нужны общие правила — как почтовая система. Эта тема о том, как устроен интернет «под капотом».</p><p><span class="q">Зачем «уровни».</span> Передать данные через полмира — сложно. Чтобы упростить, задачу разбили на <strong>уровни (слои)</strong>, каждый отвечает за свою часть. Как с письмом: ты пишешь текст (слой 1), кладёшь в конверт с адресом (слой 2), почта выбирает маршрут (слой 3), курьер везёт (слой 4). Каждый занят своим.</p>`,
concepts:[
{t:'Протокол',lat:'базовое понятие',plain:'Это набор <strong>правил</strong>, общий «язык», на котором договариваются устройства. Пока оба следуют одному протоколу, они понимают друг друга.',why:'Весь интернет — это набор протоколов. Без общих правил компьютеры разных производителей не смогли бы общаться.'},
{t:'Модель OSI — 7 уровней',lat:'эталонная, «учебная»',plain:'Идеальная модель из <strong>7 слоёв</strong> (снизу вверх): 1) физический (биты, кабели), 2) канальный (MAC-адреса, локальная сеть), 3) сетевой (IP, маршрутизация), 4) транспортный (TCP/UDP), 5) сеансовый, 6) представления (шифрование), 7) прикладной (HTTP, DNS).',why:'OSI — теоретический эталон, по нему удобно объяснять, кто за что отвечает. На практике в чистом виде не используется, но её любят спрашивать.'},
{t:'Модель TCP/IP — 4 уровня',lat:'практическая, реальная',plain:'Упрощённая рабочая модель из <strong>4 слоёв</strong>: канальный (доступ к сети), межсетевой (IP), транспортный (TCP/UDP), прикладной. По ней реально работает интернет.',why:'TCP/IP — это «сжатая» практичная версия OSI. На экзамене обе модели сравнивают: 7 уровней OSI против 4 уровней TCP/IP.'},
{t:'TCP и UDP',lat:'два транспортных протокола',plain:'<strong>TCP</strong> — надёжный: гарантирует, что данные дойдут целыми и по порядку (с подтверждением получения). <strong>UDP</strong> — быстрый, но без гарантий: шлёт и не проверяет.',why:'TCP для того, где важна точность (сайты, файлы). UDP — где важна скорость и не страшна потеря (видеозвонки, игры): лучше пропустить кадр, чем тормозить.'},
{t:'Адресация: IP, MAC, порт, DNS',lat:'как находят нужный компьютер',plain:'<strong>IP-адрес</strong> — логический адрес узла в сети. <strong>MAC-адрес</strong> — физический адрес сетевой карты (зашит в железо). <strong>Порт</strong> — номер конкретной программы на компьютере. <strong>DNS</strong> — служба, которая переводит понятное имя (mpgu.su) в IP-адрес.',why:'Это как почтовый адрес: IP — город и улица, порт — номер квартиры, DNS — справочник, который по фамилии находит адрес.'}
],
example:`<p>Что происходит, когда ты открываешь сайт:</p><p>1. <strong>DNS</strong> переводит имя сайта (mpgu.su) в IP-адрес.<br>2. <strong>TCP</strong> устанавливает надёжное соединение с сервером.<br>3. Данные дробятся на пакеты, каждому приписывается <strong>IP</strong>-адрес назначения (сетевой уровень).<br>4. Пакеты идут «кадрами» по проводам через <strong>MAC</strong>-адреса (канальный уровень).</p><p>На сервере всё собирается в обратном порядке. И так — за доли секунды.</p>`,
check:{q:'Чем TCP отличается от UDP и когда что используют?',a:'<strong>TCP</strong> — надёжный, с подтверждением доставки и сохранением порядка; используется там, где важна точность (сайты, файлы, почта). <strong>UDP</strong> — быстрый, но без гарантий доставки; используется там, где важна скорость и не критична потеря (видеозвонки, онлайн-игры, стримы).'},
formal:`<p><strong>Сеть</strong> — совокупность узлов для обмена данными; Интернет — глобальная сеть на стеке TCP/IP. Взаимодействие строится по уровневой модели. <strong>OSI</strong> — 7 уровней: физический, канальный (MAC), сетевой (IP, маршрутизация), транспортный (TCP, UDP), сеансовый, представления, прикладной (HTTP, FTP, DNS). <strong>TCP/IP</strong> — практическая модель из 4 уровней: канальный, межсетевой, транспортный, прикладной. TCP обеспечивает надёжную передачу с подтверждением, UDP — быструю без гарантий. Адресация: IP (логический), MAC (физический), порт (приложение), DNS (имя → IP).</p>`,
remember:['<strong>OSI</strong> — 7 уровней (эталон), <strong>TCP/IP</strong> — 4 уровня (практика)','Снизу вверх: физический → канальный (MAC) → сетевой (IP) → транспортный (TCP/UDP) → прикладной (HTTP)','<strong>TCP</strong> — надёжный (сайты, файлы), <strong>UDP</strong> — быстрый (видео, игры)','Адресация: IP (логический), MAC (физический), порт (приложение)','<strong>DNS</strong> переводит имя сайта в IP-адрес']
},
{
id:11,cat:'hw',title:'Числа с фиксированной и плавающей запятой',q:'Представление чисел с фиксированной и плавающей запятой. Мантисса, одинарная и двойная точность.',
teaser:'Как компьютер хранит дробные числа и почему он иногда ошибается в дробях.',
intro:`<p><span class="q">Простыми словами.</span> Тема о том, как компьютер хранит дробные числа (3.14, 0.001). С целыми просто, а дроби хранить сложнее — нужны специальные форматы, и у компьютера ограниченное место под число.</p><p><span class="q">В чём проблема.</span> Надо уместить и очень большие, и очень маленькие, и точные дробные числа в фиксированное число битов. Для этого придумали два подхода.</p>`,
concepts:[
{t:'Фиксированная запятая',lat:'простой подход',plain:'Точка (запятая) всегда стоит на <strong>одном и том же месте</strong>, например всегда 2 знака после неё — как в ценниках: 19.99, 5.00.',why:'Просто и быстро, но негибко: либо большие числа, либо много знаков после запятой — оба сразу не получится. Узкий диапазон значений.'},
{t:'Плавающая запятая',lat:'floating point, IEEE 754',plain:'Точка может <strong>«плавать»</strong>. Число хранится как в научной записи: 1.5 × 10⁸ (это 150 000 000). Можно записать и гигантское, и крошечное число одним форматом. Стандарт называется <strong>IEEE 754</strong>.',why:'Это основной способ хранить дроби в компьютере. Гибкость: запятая сдвигается куда нужно за счёт «порядка».'},
{t:'Мантисса и порядок',lat:'из чего состоит число',plain:'Число с плавающей запятой состоит из частей: <strong>мантисса</strong> — значащие цифры (в 1.5 × 10⁸ это «1.5»). <strong>Порядок</strong> (экспонента) — показатель степени, говорит, куда сдвинуть запятую (это «8»). Плюс бит <strong>знака</strong> (плюс или минус).',why:'Эти термины почти всегда просят объяснить. Запомни: мантисса = цифры, порядок = масштаб.'},
{t:'float и double',lat:'два размера',plain:'<strong>float</strong> (одинарная точность) — занимает <strong>32 бита</strong>, хранит около 7 значащих цифр. <strong>double</strong> (двойная точность) — <strong>64 бита</strong>, около 15–16 цифр, точнее.',why:'Выбор между ними — компромисс: float экономит память, double точнее. В вычислениях обычно берут double.'},
