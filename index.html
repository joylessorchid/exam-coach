/* строим regex один раз; ключи сортируем по длине (длинные раньше) */
const glossKeys=Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
const glossRe=new RegExp('('+glossKeys.map(escapeRe).join('|')+')','g');

/* подсветка терминов внутри элемента: обходим только текстовые узлы, не трогаем уже выделенные */
function applyGlossary(root){
  if(!root)return;
  const skip=new Set(['CODE','PRE','BUTTON']);
  const seen=new Set(); // каждый термин подсвечиваем 1 раз на урок
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      let p=node.parentElement;
      while(p&&p!==root){
        if(skip.has(p.tagName)||p.classList.contains('term')||p.classList.contains('gloss'))return NodeFilter.FILTER_REJECT;
        p=p.parentElement;
      }
      return glossRe.test(node.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }
  });
  const targets=[];
  while(walker.nextNode())targets.push(walker.currentNode);
  targets.forEach(node=>{
    glossRe.lastIndex=0;
    let html='',last=0,m,changed=false;
    while((m=glossRe.exec(node.nodeValue))){
      const key=m[1];
      if(seen.has(key.toLowerCase())){continue;}
      seen.add(key.toLowerCase());
      const def=GLOSSARY[key]||GLOSSARY[Object.keys(GLOSSARY).find(k=>k.toLowerCase()===key.toLowerCase())];
      html+=esc(node.nodeValue.slice(last,m.index))+`<span class="gloss" data-def="${def.replace(/"/g,'&quot;')}" data-term="${key.replace(/"/g,'&quot;')}">${key}</span>`;
      last=m.index+key.length;changed=true;
    }
    if(changed){
      html+=esc(node.nodeValue.slice(last));
      const span=document.createElement('span');
      span.innerHTML=html;
      node.parentNode.replaceChild(span,node);
    }
  });
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* всплывающее окно подсказки */
let glossPop=null;
function showGloss(el){
  hideGloss();
  glossPop=document.createElement('div');
  glossPop.className='gloss-pop';
  glossPop.innerHTML=`<b>${el.dataset.term}</b>${el.dataset.def}`;
  document.body.appendChild(glossPop);
  const r=el.getBoundingClientRect();
  const pw=Math.min(300,window.innerWidth-24);
  let left=r.left+r.width/2-pw/2;
  left=Math.max(12,Math.min(left,window.innerWidth-pw-12));
  glossPop.style.width=pw+'px';
  glossPop.style.left=left+'px';
  let top=r.bottom+8;
  glossPop.style.top=top+'px';
  requestAnimationFrame(()=>{
    const ph=glossPop.offsetHeight;
    if(top+ph>window.innerHeight-12){glossPop.style.top=(r.top-ph-8)+'px';}
    glossPop.classList.add('show');
  });
}
function hideGloss(){if(glossPop){glossPop.remove();glossPop=null;}document.querySelectorAll('.gloss.open').forEach(e=>e.classList.remove('open'));}
/* hover на десктопе, тап на мобильном */
document.addEventListener('mouseover',e=>{const g=e.target.closest('.gloss');if(g)showGloss(g);});
document.addEventListener('mouseout',e=>{if(e.target.closest('.gloss'))hideGloss();});
document.addEventListener('click',e=>{
  const g=e.target.closest('.gloss');
  if(g){e.stopPropagation();if(g.classList.contains('open')){hideGloss();}else{hideGloss();g.classList.add('open');showGloss(g);}}
  else hideGloss();
});
window.addEventListener('scroll',hideGloss,true);

function go(m){
  mode=m;lessonId=null;
  document.getElementById('tab-grid').classList.toggle('active',m==='grid');
  document.getElementById('tab-flash').classList.toggle('active',m==='flash');
  document.getElementById('tab-howto').classList.toggle('active',m==='howto');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function openLesson(id){mode='lesson';lessonId=id;render();window.scrollTo({top:0});}
function onSearch(v){curSearch=v.toLowerCase().trim();if(mode!=='grid')go('grid');else render();}

function updateProgress(){
  const n=learned.size;
  document.getElementById('learned-n').textContent=n;
  const c=2*Math.PI*16, off=c*(1-n/22);
  const fg=document.getElementById('ring-fg');
  fg.style.strokeDasharray=c;fg.style.strokeDashoffset=off;
}

function toggleLearned(id,e){
  if(e)e.stopPropagation();
  learned.has(id)?learned.delete(id):learned.add(id);
  updateProgress();render();
}

function copyFormal(id,e){
  if(e)e.stopPropagation();
  const el=document.getElementById('formal-'+id);
  if(!el)return;
  const text=el.innerText.replace(/\n{3,}/g,'\n\n').trim();
  const btn=e.currentTarget;
  navigator.clipboard.writeText(text).then(()=>{
    btn.classList.add('copied');
    const orig=btn.innerHTML;
    btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>скопировано';
    setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML=orig;},1800);
  }).catch(()=>{
    btn.textContent='выдели вручную';
  });
}

function filtered(){
  return TOPICS.filter(t=>{
    if(curCat!=='all'&&t.cat!==curCat)return false;
    if(curSearch){
      const hay=(t.title+' '+t.q+' '+t.simple+' '+t.explain).toLowerCase();
      if(!hay.includes(curSearch))return false;
    }
    return true;
  });
}

/* ---------- RENDER ---------- */
function render(){
  if(mode==='lesson')return renderLesson();
  if(mode==='flash')return renderFlash();
  if(mode==='howto')return renderHowto();
  renderGrid();
}

function renderGrid(){
  const counts={all:TOPICS.length};
  TOPICS.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
  let chips=`<button class="chip ${curCat==='all'?'active':''}" style="${curCat==='all'?'background:var(--accent)':''}" onclick="setCat('all')">Все · ${counts.all}</button>`;
  for(const k in CATS){
    if(!counts[k])continue;
    const active=curCat===k;
    chips+=`<button class="chip ${active?'active':''}" style="${active?`background:${CATS[k].color};color:#10110f`:`color:${CATS[k].color}`}" onclick="setCat('${k}')"><span class="dot"></span>${CATS[k].label} · ${counts[k]}</button>`;
  }
  const list=filtered();
  let cards='';
  list.forEach((t,i)=>{
    const c=CATS[t.cat];
    cards+=`<article class="card ${learned.has(t.id)?'learned':''}" style="--cat:${c.color};animation-delay:${i*0.04}s" onclick="openLesson(${t.id})">
      <span class="num">${String(t.id).padStart(2,'0')}</span>
      <span class="cat-tag"><span class="dot"></span>${c.label}</span>
      <h3>${t.title}</h3>
      <p class="teaser">${stripTags(t.simple)}</p>
      <span class="learned-badge"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--cat)"/><path d="m7 12 3 3 7-7" fill="none" stroke="#11110d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </article>`;
  });
  view.innerHTML=`
    <section class="hero">
      <div class="kick">3 дня до защиты · поехали</div>
      <h2>Разберём все 22 вопроса <em>по-настоящему</em> — с примерами и самопроверкой.</h2>
      <p>Каждая тема: идея на пальцах, объяснение сути, конкретный пример и выжимка «что запомнить». Нажми на карточку, чтобы открыть урок, и отмечай пройденное.</p>
    </section>
    <div class="chips">${chips}</div>
    ${list.length?`<div class="grid">${cards}</div>`:`<div class="empty">Ничего не нашлось по запросу «${curSearch}». Попробуй другое слово.</div>`}
  `;
  updateProgress();
}
function setCat(c){curCat=c;render();}
function stripTags(h){return h.replace(/<[^>]+>/g,'');}

        <span class="nt">${next?next.title:'—'}</span>
      </button>
    </nav>
  </article>`;
  // подсветка терминов только в смысловых блоках (не в формальном ответе и не в коде)
  applyGlossary(view.querySelector('.section.simple .s-body'));
  view.querySelectorAll('.section:not(.simple):not(.formal):not(.remember) .s-body').forEach(applyGlossary);
}

let flashDeck=[],flashIdx=0,flashFlipped=false,flashCat='all';
function buildDeck(){
  flashDeck=TOPICS.filter(t=>flashCat==='all'||t.cat===flashCat);
  for(let i=flashDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];}
  flashIdx=0;flashFlipped=false;
}
function renderFlash(){
  if(!flashDeck.length)buildDeck();
  const counts={all:TOPICS.length};
  TOPICS.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
  let pick=`<button class="chip ${flashCat==='all'?'active':''}" style="${flashCat==='all'?'background:var(--accent)':''}" onclick="setFlashCat('all')">Все · ${counts.all}</button>`;
  for(const k in CATS){if(!counts[k])continue;const a=flashCat===k;pick+=`<button class="chip ${a?'active':''}" style="${a?`background:${CATS[k].color};color:#10110f`:`color:${CATS[k].color}`}" onclick="setFlashCat('${k}')"><span class="dot"></span>${CATS[k].label}</button>`;}
  const t=flashDeck[flashIdx];const c=CATS[t.cat];
  view.innerHTML=`<div class="flash-wrap">
    <div class="flash-top">
      <span class="flash-count">Карточка ${flashIdx+1} / ${flashDeck.length}</span>
      <button class="back" style="margin:0" onclick="reshuffle()">⟳ перемешать</button>
    </div>
    <div class="flash-cat-pick">${pick}</div>
    <div class="flashcard ${flashFlipped?'flipped':''}" style="--cat:${c.color}" onclick="flipCard()">
      <div class="fc-inner">
        <div class="fc-face fc-front">
          <div class="fc-num">${String(t.id).padStart(2,'0')}</div>
          <div class="fc-tag">${c.label}</div>
          <div class="fc-q">${t.title}</div>
          <div class="fc-hint">нажми, чтобы увидеть суть →</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-tag">Что запомнить</div>
          <div class="fc-a">${t.remember}</div>
        </div>
      </div>
    </div>
    <div class="flash-ctrl">
      <button onclick="prevCard(event)">← назад</button>
      <button class="primary" onclick="nextCard(event)">${flashIdx===flashDeck.length-1?'сначала':'дальше →'}</button>
    </div>
  </div>`;
}
function setFlashCat(c){flashCat=c;buildDeck();renderFlash();}
function flipCard(){flashFlipped=!flashFlipped;renderFlash();}
function nextCard(e){if(e)e.stopPropagation();flashIdx=(flashIdx+1)%flashDeck.length;flashFlipped=false;renderFlash();}
function prevCard(e){if(e)e.stopPropagation();flashIdx=(flashIdx-1+flashDeck.length)%flashDeck.length;flashFlipped=false;renderFlash();}
function reshuffle(){buildDeck();renderFlash();}

/* keyboard nav for flashcards */
document.addEventListener('keydown',e=>{
  if(mode!=='flash')return;
  if(e.key==='ArrowRight')nextCard();
  else if(e.key==='ArrowLeft')prevCard();
  else if(e.key===' '){e.preventDefault();flipCard();}
});

render();
</script>
