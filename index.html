{t:'Почему нельзя сравнивать на равенство',lat:'важный практический вывод',plain:'<strong>Не все дроби можно представить точно.</strong> Например, 0.1 в двоичном виде — бесконечная дробь, хранится приближённо. Поэтому 0.1 + 0.2 может дать не ровно 0.3, а 0.30000000004.',why:'Из-за этого вещественные числа нельзя сравнивать на строгое равенство (==) — сравнивают с небольшим допуском. А деньги хранят в целых копейках, а не во float.'}
],
example:`<p>Число <strong>6.25</strong> в плавающей запятой:</p><p>6.25 в двоичном виде = 110.01, что можно записать как <strong>1.1001 × 2²</strong>.<br>Значит: мантисса = 1.1001, порядок = 2, знак = плюс.</p><p>А вот число <strong>0.1</strong> точно записать не получится — в двоичном виде это бесконечная дробь. Отсюда копеечные погрешности в расчётах. Поэтому в банковских программах деньги хранят в целых копейках (integer), а не как float.</p>`,
check:{q:'Что такое мантисса и порядок, и почему дроби нельзя сравнивать на равенство?',a:'<strong>Мантисса</strong> — значащие цифры числа, <strong>порядок</strong> — показатель степени, задающий масштаб (куда сдвинуть запятую). Дроби нельзя сравнивать на строгое равенство, потому что многие из них (например, 0.1) представляются <strong>приближённо</strong> — отсюда погрешности округления. Сравнивают с небольшим допуском.'},
formal:`<p>Вещественные числа хранят в двух форматах. В формате <strong>с фиксированной запятой</strong> положение точки задано жёстко — просто, но узкий диапазон. В формате <strong>с плавающей запятой</strong> (стандарт IEEE 754) число представляется как мантисса × основание в степени порядка и состоит из полей: знак, порядок (экспонента, масштаб), мантисса (значащие цифры). Точность: <strong>float</strong> — 32 бита, около 7 значащих цифр; <strong>double</strong> — 64 бита, около 15–16 цифр. Не все дроби представимы точно, поэтому вещественные числа нельзя сравнивать на строгое равенство.</p>`,
remember:['<strong>Фиксированная</strong> запятая — точка на одном месте, узкий диапазон','<strong>Плавающая</strong> (IEEE 754) — поля: знак, порядок, мантисса','<strong>Мантисса</strong> — значащие цифры, <strong>порядок</strong> — масштаб','<strong>float</strong> = 32 бита (~7 цифр), <strong>double</strong> = 64 бита (~16 цифр)','Дроби хранятся неточно → не сравнивать на == ']
},
{
id:12,cat:'swd',title:'Принципы ООП',q:'Принципы объектно-ориентированного программирования. Примеры.',
teaser:'Способ писать программы через «объекты», похожие на предметы реального мира.',
intro:`<p><span class="q">Простыми словами.</span> <strong>ООП</strong> (объектно-ориентированное программирование) — способ писать программы, представляя их как набор «объектов», похожих на предметы из жизни.</p><p><span class="q">Что за объекты и зачем.</span> Объект — это что-то со свойствами (данными) и действиями (что умеет). Например, объект «Машина»: свойства — цвет, скорость; действия — ехать, тормозить. Всё про машину лежит в одном месте. Это ближе к тому, как мы мыслим, и помогает не запутаться в большой программе.</p>`,
concepts:[
{t:'Класс и объект',lat:'основа основ',plain:'<strong>Класс</strong> — это чертёж, описание (чертёж машины вообще). <strong>Объект</strong> — конкретный экземпляр по этому чертежу (твоя красная машина с номером А123). По одному классу можно создать много объектов.',why:'Это самое базовое различие в ООП. Класс — шаблон, объект — конкретная вещь по шаблону.'},
{t:'Инкапсуляция',lat:'1-й принцип',plain:'Объединить данные и действия в одном объекте и <strong>спрятать внутренности</strong>. Снаружи доступен только «пульт управления» (публичные методы), а как оно работает внутри — скрыто (приватные данные).',why:'Защищает данные от порчи: нельзя залезть напрямую и сломать, только через проверенные методы. Пример: у банковского счёта баланс приватный, менять его можно только через метод «пополнить» или «снять», которые проверяют корректность.'},
{t:'Наследование',lat:'2-й принцип',plain:'Новый класс <strong>перенимает</strong> свойства и действия существующего, добавляя своё. Например, класс «Собака» наследует от класса «Животное» общее (имя, «есть»), а добавляет своё («лаять»).',why:'Не нужно дублировать код. Общее пишем один раз в родительском классе, а потомки берут его готовым и дополняют.'},
{t:'Полиморфизм',lat:'3-й принцип, «много форм»',plain:'Один и тот же вызов даёт <strong>разное поведение</strong> у разных объектов. Команда «издать голос» у собаки выдаёт «Гав», у кошки — «Мяу», хотя команда одна и та же.',why:'Позволяет писать общий код, работающий с разными типами объектов единообразно. Реализуется через переопределение методов в классах-потомках.'},
{t:'Абстракция',lat:'4-й принцип',plain:'Выделить <strong>только важное</strong>, спрятав ненужные детали. Ты водишь машину через руль и педали, не зная устройства двигателя.',why:'Упрощает работу: используешь объект через простой интерфейс, не вникая в его сложную начинку. Реализуется через абстрактные классы и интерфейсы.'}
],
example:`<pre><span class="cm">// Класс — чертёж (абстракция: общая идея)</span>
class Животное {
  <span class="cm">приватное</span> возраст     <span class="cm">// инкапсуляция: скрыто</span>
  голос() { ... }
}
<span class="cm">// Наследование: Собака берёт всё от Животного</span>
class Собака extends Животное {
  голос() { return "Гав" }   <span class="cm">// полиморфизм: своё поведение</span>
}
class Кошка extends Животное {
  голос() { return "Мяу" }   <span class="cm">// тот же метод, другой результат</span>
}</pre><p>Вызов <code>животное.голос()</code> у собаки даст «Гав», у кошки «Мяу» — это полиморфизм в действии.</p>`,
check:{q:'Назови 4 принципа ООП и что значит инкапсуляция.',a:'Четыре принципа: <strong>инкапсуляция, наследование, полиморфизм, абстракция</strong>. <strong>Инкапсуляция</strong> — объединение данных и методов в объекте с <strong>сокрытием внутренней реализации</strong>: снаружи доступен только публичный интерфейс, а внутренние данные защищены от прямого изменения.'},
formal:`<p><strong>ООП</strong> — парадигма, где программа представляется как совокупность взаимодействующих объектов; класс — шаблон типа, объект — его экземпляр. Принципы: <strong>инкапсуляция</strong> — объединение данных и методов с сокрытием реализации; <strong>наследование</strong> — создание класса на основе существующего с заимствованием его свойств; <strong>полиморфизм</strong> — способность объектов с общим интерфейсом проявлять разное поведение (через переопределение методов); <strong>абстракция</strong> — выделение существенных характеристик и сокрытие деталей через абстрактные классы и интерфейсы.</p>`,
remember:['<strong>Класс</strong> — чертёж, <strong>объект</strong> — экземпляр по нему','<strong>Инкапсуляция</strong> — объединить данные+методы, скрыть внутренности','<strong>Наследование</strong> — перенять свойства родителя (не дублировать код)','<strong>Полиморфизм</strong> — один вызов, разное поведение','<strong>Абстракция</strong> — выделить главное, спрятать детали']
},
{
id:13,cat:'db',title:'Code First / Database First. MVC',q:'Принципы построения модели Code First и Database First. Как реализуется логика и представление в MVC.',
teaser:'Что создавать первым — код или базу данных, и как код общается с базой.',
intro:`<p><span class="q">Простыми словами.</span> В программе данные живут в виде «классов» (объектов), а в базе данных — в виде «таблиц». Вопрос: что создавать первым? Code First — сначала код, Database First — сначала база.</p><p><span class="q">Зачем это знать.</span> Это два разных подхода к старту проекта, и выбор зависит от ситуации. А связывает мир кода и мир базы специальный «переводчик» — ORM.</p>`,
concepts:[
{t:'ORM',lat:'Object-Relational Mapping',plain:'Это «переводчик» между миром программы (объекты) и миром базы данных (таблицы). Он автоматически связывает «класс Товар» с «таблицей Товары», поле объекта со столбцом, объект со строкой.',why:'Без ORM пришлось бы вручную писать много кода для каждого обращения к базе. ORM делает это автоматически. Популярный пример — Entity Framework в .NET.'},
{t:'Database First',lat:'«сначала база»',plain:'Сначала создаёшь <strong>базу данных</strong> (таблицы), а ORM по ней <strong>автоматически генерирует классы</strong> в программе.',why:'Удобно, когда база уже существует или ею занимается отдельный специалист (администратор БД).'},
{t:'Code First',lat:'«сначала код»',plain:'Наоборот: сначала пишешь <strong>классы</strong> в программе, а ORM по ним <strong>создаёт базу данных</strong> и поддерживает её через «миграции».',why:'Удобно для новых проектов: вся «правда» в коде, базу не трогаешь руками.'},
{t:'Миграции',lat:'нужны для Code First',plain:'Это механизм пошагового изменения структуры базы с сохранением версий. Поменял класс — создал миграцию — база обновилась, а историю изменений видно.',why:'Без миграций при каждом изменении класса пришлось бы вручную переделывать базу и легко что-то сломать.'},
{t:'Роли в MVC (вторая часть вопроса)',lat:'связь с темой 2',plain:'Вопрос просит вспомнить паттерн MVC. <strong>Model</strong> — классы данных, работа с базой через ORM и бизнес-логика. <strong>View</strong> — представление, шаблоны страниц (только отображение). <strong>Controller</strong> — принимает запрос, берёт данные из Model и отдаёт их View.',why:'То есть работа с базой (Code/Database First) живёт в Model, а показ — в View. Вопрос связывает две темы воедино.'}
],
example:`<p><strong>Code First на практике:</strong></p><pre><span class="cm">// 1. Пишем класс в коде</span>
class Product { Id; Name; Price; }

<span class="cm">// 2. Запускаем миграцию — ORM сам</span>
<span class="cm">//    создаёт таблицу Products в базе</span>

<span class="cm">// 3. В контроллере берём данные:</span>
var items = db.Products.ToList();
<span class="cm">// → передаём во View → рисуется таблица товаров</span></pre><p>Поток в MVC: запрос пользователя → Controller → Model (данные из базы через ORM) → View (рисует страницу) → ответ.</p>`,
check:{q:'Чем отличаются Code First и Database First, и где в MVC работа с базой?',a:'<strong>Database First</strong> — сначала создаётся база, по ней генерируются классы. <strong>Code First</strong> — сначала пишутся классы, по ним через миграции создаётся база. Их связывает <strong>ORM</strong>. В MVC работа с базой живёт в <strong>Model</strong>, отображение — во <strong>View</strong>, а <strong>Controller</strong> их связывает.'},
formal:`<p>Подходы определяют порядок построения модели и базы данных при использовании <strong>ORM</strong> (связывает классы с таблицами). При <strong>Database First</strong> сначала создаётся база данных, по ней генерируются классы. При <strong>Code First</strong> сначала создаются классы, по ним через миграции строится база. В паттерне <strong>MVC</strong>: Model — классы данных, работа с БД через ORM и логика; View — отображение; Controller — принимает запрос, обращается к модели и передаёт данные представлению. Схема: запрос → контроллер → модель → представление → ответ.</p>`,
remember:['<strong>ORM</strong> — «переводчик» между классами в коде и таблицами в базе','<strong>Database First</strong>: база → классы (когда база уже есть)','<strong>Code First</strong>: классы → база через миграции (новый проект)','В MVC: <strong>Model</strong> — данные+ORM+логика, <strong>View</strong> — вид, <strong>Controller</strong> — связь','Поток: запрос → Controller → Model → View → ответ']
},
{
id:14,cat:'swd',title:'Принципы проектирования: SOLID, KISS, DRY',q:'Принципы проектирования программ. SOLID. KISS. DRY.',
teaser:'Правила, как писать код, чтобы его было легко читать и менять.',
intro:`<p><span class="q">Простыми словами.</span> Это набор советов-правил, как писать <strong>хороший</strong> код: понятный, который легко менять и в котором не страшно копаться через полгода.</p><p><span class="q">Зачем это нужно.</span> Код пишут один раз, а читают и меняют много раз. Если писать как попало, любая правка ломает половину программы. Главная мысль всех правил: делай просто, не дублируй, и дай каждой части кода одну понятную задачу.</p>`,
concepts:[
{t:'SOLID — что это',lat:'аббревиатура из 5 букв',plain:'Это набор из <strong>пяти принципов</strong> объектно-ориентированного проектирования. Название — аббревиатура по первым буквам пяти правил: S, O, L, I, D.',why:'Самый известный набор принципов. На экзамене нужно расшифровать каждую букву — разбираем ниже.'},
{t:'S — Single Responsibility',lat:'единственная ответственность',plain:'У класса должна быть <strong>одна задача, одна причина для изменения</strong>. Класс «Отчёт» не должен ещё и сам печататься, и сам отправляться на почту — это три разные задачи.',why:'Когда у класса одна забота, его проще понять и менять, не ломая остальное.'},
{t:'O — Open/Closed',lat:'открытость/закрытость',plain:'Код <strong>открыт для расширения</strong> (можно добавлять новое), но <strong>закрыт для изменения</strong> (старое проверенное не трогаем). Новую функцию добавляем новым кодом, а не правкой работающего.',why:'Так новые фичи не ломают то, что уже работало.'},
{t:'L — Liskov Substitution',lat:'подстановка Лисков',plain:'Объект класса-потомка можно <strong>подставить вместо родителя</strong>, и программа не сломается. Если «Квадрат» наследует «Прямоугольник», но ведёт себя не как прямоугольник — это нарушение.',why:'Гарантирует, что наследование не приводит к сюрпризам. Названо по имени учёного Барбары Лисков.'},
{t:'I — Interface Segregation',lat:'разделение интерфейсов',plain:'Лучше несколько <strong>маленьких</strong> интерфейсов, чем один огромный. Не заставляй класс реализовывать методы, которые ему не нужны.',why:'Узкие интерфейсы проще и не тянут лишнего.'},
{t:'D — Dependency Inversion',lat:'инверсия зависимостей',plain:'Завязывайся на <strong>абстракции</strong> (общие интерфейсы), а не на конкретные классы. Тогда легко подменить одну реализацию другой.',why:'Делает код гибким: можно заменить, например, способ хранения данных, не переписывая всё.'},
{t:'KISS и DRY',lat:'два простых правила',plain:'<strong>KISS</strong> (Keep It Simple, Stupid) — «делай проще, не усложняй». <strong>DRY</strong> (Don’t Repeat Yourself) — «не повторяйся», то есть не копируй один и тот же код в десять мест, вынеси его в одно.',why:'Простые, но мощные правила. Дублирование — частый источник ошибок: поправил в одном месте, забыл в девяти.'}
],
example:`<p><strong>Нарушение SRP</strong> (единственной ответственности): класс <code>User</code> сам проверяет данные, сам сохраняет в базу и сам шлёт email — три причины для изменения в одном классе.</p><p><strong>Исправление:</strong> разбить на четыре класса — <code>User</code> (данные), <code>UserValidator</code> (проверка), <code>UserRepository</code> (база), <code>EmailService</code> (почта). У каждого одна задача.</p><p><strong>Нарушение DRY:</strong> расчёт скидки скопирован в 5 местах. <strong>Исправление:</strong> вынести в один метод <code>calcDiscount()</code> и вызывать его.</p>`,
check:{q:'Расшифруй SOLID и объясни принцип S.',a:'<strong>S</strong> — Single Responsibility (единственная ответственность), <strong>O</strong> — Open/Closed (открыт для расширения, закрыт для изменения), <strong>L</strong> — Liskov Substitution (подкласс заменяет родителя), <strong>I</strong> — Interface Segregation (узкие интерфейсы), <strong>D</strong> — Dependency Inversion (зависимость от абстракций). Принцип <strong>S</strong>: у класса должна быть только одна ответственность, одна причина для изменения.'},
formal:`<p>Принципы проектирования обеспечивают сопровождаемый и расширяемый код. <strong>SOLID</strong> — пять принципов: <strong>S</strong> — единственная ответственность (одна причина для изменения класса); <strong>O</strong> — открытость/закрытость (открыт для расширения, закрыт для модификации); <strong>L</strong> — подстановка Лисков (подкласс заменяет базовый без поломки); <strong>I</strong> — разделение интерфейсов (узкие интерфейсы вместо общего); <strong>D</strong> — инверсия зависимостей (зависимость от абстракций). <strong>KISS</strong> — стремление к простоте. <strong>DRY</strong> — исключение дублирования кода.</p>`,
remember:['<strong>SOLID</strong> — 5 принципов проектирования','S — одна ответственность, O — расширяем не меняя, L — подкласс заменяет родителя','I — узкие интерфейсы, D — зависим от абстракций','<strong>KISS</strong> — делай проще','<strong>DRY</strong> — не дублируй код']
},
{
id:15,cat:'db',title:'Проектирование БД. Нормальные формы',q:'Проектирование баз данных. Концептуальный, логический, физический уровень. Нормальные формы.',
diagram:'<svg viewBox="0 0 440 210" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.cell{fill:#1c1f29;stroke:var(--cat);stroke-width:1}.hdr{fill:var(--cat)}.t1{fill:#ece8df;font-size:11px;text-anchor:middle}.t2{fill:#11110d;font-size:11px;font-weight:700;text-anchor:middle}.bad{fill:#3a2326;stroke:#bf4250}.hd{font-size:11px;font-weight:700;text-anchor:middle;font-family:JetBrains Mono,monospace}.ar{stroke:var(--cat);stroke-width:2;fill:none;marker-end:url(#f)}</style><defs><marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="var(--cat)"/></marker></defs><text class="hd" x="100" y="16" fill="#bf4250">Плохо (нарушает 1НФ)</text><rect class="hdr" x="20" y="26" width="160" height="22"/><text class="t2" x="100" y="41">Заказ | Товары</text><rect class="bad" x="20" y="48" width="160" height="26"/><text class="t1" x="100" y="65" fill="#e8a0aa">#1 | яблоки, груши</text><text class="t1" x="100" y="92" fill="#bf4250" style="font-size:10px">список в ячейке — нельзя!</text><path class="ar" d="M190 60 L250 60"/><text class="hd" x="345" y="16" fill="var(--cat)">Хорошо (1НФ)</text><rect class="hdr" x="270" y="26" width="150" height="22"/><text class="t2" x="345" y="41">Заказ | Товар</text><rect class="cell" x="270" y="48" width="150" height="22"/><text class="t1" x="345" y="63">#1 | яблоки</text><rect class="cell" x="270" y="70" width="150" height="22"/><text class="t1" x="345" y="85">#1 | груши</text><text class="hd" x="220" y="135" fill="var(--cat)">1НФ — одно значение в ячейке</text><text class="t1" x="220" y="160" fill="#9b978d">2НФ — зависимость от всего ключа</text><text class="t1" x="220" y="182" fill="#9b978d">3НФ — нет транзитивных зависимостей</text></svg><div class=\'dg-cap\'>Слева — нарушение 1НФ: список «яблоки, груши» в одной ячейке. Справа — правильно: каждый товар в своей строке. Цель нормализации — порядок и отсутствие дублей.</div>',
teaser:'Как продумать структуру базы данных, чтобы не было дублей и путаницы.',
intro:`<p><span class="q">Простыми словами.</span> <strong>База данных (БД)</strong> — организованное хранилище информации, обычно в виде таблиц (как Excel, но мощнее). <strong>Проектирование БД</strong> — продумывание, какие таблицы нужны и как они связаны, ещё до их создания.</p><p><span class="q">Зачем это нужно.</span> Если свалить данные в кучу — начнётся бардак: одно и то же хранится в десяти местах, при изменении легко что-то забыть и получить противоречие. Грамотное проектирование этого избегает.</p>`,
concepts:[
{t:'Три уровня проектирования',lat:'от общего к частному',plain:'Базу проектируют поэтапно: сначала набросок на бумаге, потом таблицы, потом реализация. Три уровня: концептуальный → логический → физический.',why:'Идти от абстрактного к конкретному проще, чем сразу прыгать в детали. Каждый уровень — отдельный шаг.'},
{t:'Концептуальный уровень',lat:'1-й, самый абстрактный',plain:'Рисуем <strong>ER-диаграмму</strong> (Entity-Relationship, «сущность-связь»): какие есть объекты (Студент, Курс), их свойства и как они связаны. Без привязки к конкретной программе.',why:'Это «карандашный набросок» — понять, что вообще будет в базе, не думая о технике.'},
{t:'Логический уровень',lat:'2-й',plain:'Превращаем набросок в <strong>таблицы</strong>: определяем столбцы, ключи, связи. Здесь же делаем <strong>нормализацию</strong> (наводим порядок).',why:'Здесь абстрактные сущности становятся конкретными таблицами реляционной базы.'},
{t:'Физический уровень',lat:'3-й, самый конкретный',plain:'Реальная реализация под конкретную СУБД: типы данных столбцов, <strong>индексы</strong> (для ускорения поиска), как данные лежат на диске.',why:'Это финальная настройка «как именно» хранить, чтобы работало быстро.'},
{t:'Нормализация и нормальные формы',lat:'НФ — наведение порядка',plain:'<strong>Нормализация</strong> — приведение таблиц к «нормальным формам», чтобы убрать дубли и противоречия. <strong>1НФ</strong> — в каждой ячейке одно значение (не список). <strong>2НФ</strong> — 1НФ + каждый столбец зависит от всего ключа. <strong>3НФ</strong> — 2НФ + нет «транзитивных» зависимостей (один неключевой столбец не зависит от другого неключевого).',why:'Цель — каждый факт хранится <strong>в одном месте</strong>. Тогда при изменении не нужно править его в десяти строках. НФБК — усиленная версия 3НФ.'}
],
example:`<p>Плохая таблица: <code>Заказ(номер, товары="яблоки, груши", город, индекс_города)</code>.</p><p><strong>Нарушает 1НФ:</strong> «яблоки, груши» — список в одной ячейке → разбиваем на отдельные строки.</p><p><strong>Нарушает 3НФ:</strong> индекс зависит от города, а не от заказа (это транзитивная зависимость) → выносим в отдельную таблицу <code>Город(город, индекс)</code>.</p><p>После нормализации город с индексом хранится <strong>один раз</strong>. Поменялся индекс — правим в одном месте, а не в тысяче заказов.</p>`,
check:{q:'Назови три уровня проектирования и что требует 1НФ.',a:'Три уровня: <strong>концептуальный</strong> (ER-диаграмма, без привязки к технике), <strong>логический</strong> (таблицы, ключи, нормализация), <strong>физический</strong> (типы данных, индексы, реализация в СУБД). <strong>1НФ</strong> требует <strong>атомарности</strong> — в каждой ячейке одно неделимое значение, а не список.'},
formal:`<p>Проектирование БД ведётся на трёх уровнях: <strong>концептуальном</strong> (модель «сущность-связь», ER-диаграмма, без привязки к СУБД), <strong>логическом</strong> (таблицы, ключи, связи, нормализация), <strong>физическом</strong> (типы данных, индексы, реализация в конкретной СУБД). <strong>Нормализация</strong> устраняет избыточность и аномалии: <strong>1НФ</strong> — атомарность значений; <strong>2НФ</strong> — 1НФ и полная зависимость неключевых атрибутов от первичного ключа; <strong>3НФ</strong> — 2НФ и отсутствие транзитивных зависимостей; <strong>НФБК</strong> — усиление 3НФ. Цель — каждый факт хранится в одном месте.</p>`,
remember:['Уровни: <strong>концептуальный</strong> (ER) → <strong>логический</strong> (таблицы+нормализация) → <strong>физический</strong> (индексы)','<strong>1НФ</strong> — атомарность (в ячейке одно значение)','<strong>2НФ</strong> — зависимость от всего ключа','<strong>3НФ</strong> — нет транзитивных зависимостей','Цель нормализации — каждый факт в одном месте']
},
{
id:16,cat:'web',title:'Протокол HTTP, методы. FTP',q:'Протокол HTTP, методы HTTP-запроса. Протокол FTP.',
diagram:'<svg viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.bx{fill:#1c1f29;stroke:var(--cat);stroke-width:2}.t1{fill:#ece8df;font-size:14px;font-weight:600;text-anchor:middle}.ts{fill:#9b978d;font-size:11px;text-anchor:middle}.req{fill:var(--cat);font-size:12px;font-weight:600;text-anchor:middle;font-family:JetBrains Mono,monospace}.ar{stroke:var(--cat);stroke-width:2.5;fill:none;marker-end:url(#d)}</style><defs><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--cat)"/></marker></defs><rect class="bx" x="25" y="70" width="120" height="60" rx="10"/><text class="t1" x="85" y="96">Браузер</text><text class="ts" x="85" y="114">клиент</text><rect class="bx" x="295" y="70" width="120" height="60" rx="10"/><text class="t1" x="355" y="96">Сервер</text><text class="ts" x="355" y="114">отдаёт данные</text><path class="ar" d="M148 88 L292 88"/><text class="req" x="220" y="80">GET /page → запрос</text><path class="ar" d="M292 116 L148 116"/><text class="req" x="220" y="135">← ответ: 200 OK</text></svg><div class=\'dg-cap\'>HTTP работает по схеме «запрос-ответ»: браузер шлёт запрос с методом (GET/POST...), сервер отвечает кодом (200 OK, 404...). Поскольку HTTP не помнит прошлые запросы (stateless), для памяти о пользователе нужны cookie.</div>',
teaser:'Языки, на которых браузер просит страницы, а компьютеры передают файлы.',
intro:`<p><span class="q">Простыми словами.</span> Это два «языка общения» в интернете. <strong>HTTP</strong> — как браузер просит у сервера веб-страницы. <strong>FTP</strong> — как передают файлы между компьютерами.</p><p><span class="q">Зачем это знать.</span> Это основа работы вебом. Когда видишь ошибку «404» — это ответ по HTTP. Понимание методов HTTP нужно любому, кто делает сайты или работает с интернетом.</p>`,
concepts:[
{t:'HTTP',lat:'HyperText Transfer Protocol',plain:'Протокол, по которому браузер и сервер общаются по схеме «запрос-ответ»: браузер просит → сервер отвечает. Работает поверх TCP. Обычный порт — 80, защищённая версия <strong>HTTPS</strong> (с шифрованием) — порт 443.',why:'Это основа всего веба. Важная деталь: HTTP <strong>«забывчивый» (stateless)</strong> — каждый запрос обрабатывается как впервые, сервер не помнит предыдущий. Поэтому для «запоминания» пользователя придумали cookie и сессии.'},
{t:'Методы HTTP-запроса',lat:'что мы хотим сделать',plain:'Когда браузер обращается к серверу, он указывает, <strong>что хочет сделать</strong> — это методы (как глаголы): <strong>GET</strong> — «дай данные», <strong>POST</strong> — «прими новые данные» (форма регистрации), <strong>PUT</strong> — «замени целиком», <strong>PATCH</strong> — «измени частично», <strong>DELETE</strong> — «удали».',why:'Методы почти всегда просят перечислить. GET и POST — самые частые: GET для получения, POST для отправки.'},
{t:'Коды ответа',lat:'статус ответа сервера',plain:'Сервер отвечает кодом-числом: <strong>2xx</strong> — успех (200 OK), <strong>3xx</strong> — перенаправление, <strong>4xx</strong> — ошибка клиента (знаменитая 404 «не найдено», 403 «запрещено»), <strong>5xx</strong> — ошибка сервера (500).',why:'Коды помогают понять, что произошло. Группы по первой цифре легко запомнить: 4xx — «ты ошибся», 5xx — «сервер сломался».'},
{t:'FTP',lat:'File Transfer Protocol',plain:'Отдельный протокол для <strong>передачи файлов</strong>. Особенность — использует <strong>два соединения</strong>: управляющее (порт 21) для команд и для данных (порт 20) для самих файлов.',why:'Старый протокол, передаёт данные в открытом виде (небезопасно), поэтому сейчас используют защищённые версии — FTPS и SFTP.'},
{t:'Активный и пассивный режим FTP',lat:'',plain:'Два способа установить соединение для данных. В <strong>активном</strong> сервер сам подключается к клиенту, в <strong>пассивном</strong> — клиент сам инициирует оба соединения.',why:'Пассивный режим работает за фаерволом/роутером (NAT), где активный не пройдёт. Это нюанс, который стоит упомянуть.'}
],
example:`<p>Регистрация на сайте по HTTP:</p><p>1. Браузер отправляет <strong>POST /register</strong> с данными формы (логин, пароль) в теле запроса.<br>2. Сервер создаёт пользователя.<br>3. Отвечает кодом <strong>200 OK</strong> (успех) — или <strong>400</strong>, если данные кривые.</p><p>А открытие профиля — это <strong>GET /profile/123</strong>: браузер просит данные, сервер их возвращает. GET — получить, POST — отправить.</p>`,
check:{q:'Что значит, что HTTP «stateless», и чем GET отличается от POST?',a:'<strong>Stateless</strong> — HTTP не сохраняет состояние: каждый запрос обрабатывается независимо, сервер не помнит предыдущие (для запоминания используют cookie/сессии). <strong>GET</strong> — получить данные (без тела запроса), <strong>POST</strong> — отправить/создать данные (например, форму). GET — «дай», POST — «прими».'},
formal:`<p><strong>HTTP</strong> — прикладной протокол передачи гипертекста поверх TCP по модели «запрос-ответ»; не сохраняет состояние (stateless). Порт 80, защищённая версия HTTPS (с шифрованием TLS) — 443. Методы: GET (получить), POST (создать), PUT (заменить), PATCH (частично обновить), DELETE (удалить), HEAD, OPTIONS. Коды: 2xx успех, 3xx перенаправление, 4xx ошибка клиента, 5xx ошибка сервера. <strong>FTP</strong> — протокол передачи файлов, использует два соединения: управляющее (порт 21) и данных (порт 20); режимы активный и пассивный; незащищён, поэтому применяют FTPS и SFTP.</p>`,
remember:['<strong>HTTP</strong> — запрос-ответ, поверх TCP, порт 80 (HTTPS — 443)','HTTP <strong>stateless</strong> — не помнит предыдущие запросы (отсюда cookie)','Методы: <strong>GET</strong> (получить), <strong>POST</strong> (создать), PUT, PATCH, DELETE','Коды: 2xx успех, 4xx ошибка клиента (404), 5xx ошибка сервера','<strong>FTP</strong> — 2 канала (21 команды, 20 данные), есть FTPS/SFTP']
},
{
id:17,cat:'db',title:'Реляционная алгебра',q:'Реляционная алгебра. Отношение, схема, атрибуты. Операции над отношениями.',
teaser:'«Математика таблиц» — теоретическая основа языка запросов SQL.',
intro:`<p><span class="q">Простыми словами.</span> Это математическая теория о том, как работать с таблицами в базе данных строгими операциями. Звучит страшно, но идея простая: это <strong>«алгебра для таблиц»</strong>.</p><p><span class="q">Зачем это нужно.</span> Когда ты делаешь запрос к базе («покажи студентов старше 18»), под капотом происходят именно эти операции. Язык SQL построен на реляционной алгебре — это её теоретический фундамент.</p>`,
concepts:[
{t:'Зачем странные названия',lat:'предупреждение',plain:'В этой теории у обычных вещей свои научные названия. Главное — запомнить «перевод»: таблица = отношение, строка = кортеж, столбец = атрибут. Дальше всё просто.',why:'Половина сложности темы — именно в непривычных словах. Разберёшь их — и всё станет понятно.'},
{t:'Отношение',lat:'relation = таблица',plain:'Это просто <strong>таблица</strong>. Математически — множество строк. Слово «реляционный» (как в «реляционная база данных») происходит именно отсюда — от relation.',why:'Базовый термин. Когда слышишь «отношение» — представляй обычную таблицу.'},
{t:'Атрибут, кортеж, схема, домен',lat:'остальной словарь',plain:'<strong>Атрибут</strong> — столбец (например, «Имя»). <strong>Кортеж</strong> — строка (одна запись). <strong>Схема</strong> — «шапка» таблицы: её имя и список столбцов. <strong>Домен</strong> — множество допустимых значений столбца (по сути его тип, например «только целые числа»).',why:'Эти четыре слова почти всегда просят определить. Запомни связку: атрибут=столбец, кортеж=строка.'},
{t:'Выборка (σ) и проекция (π)',lat:'две главные операции',plain:'<strong>Выборка (σ, сигма)</strong> — отбор <strong>строк</strong> по условию (например, «возраст > 18»). <strong>Проекция (π, пи)</strong> — отбор <strong>столбцов</strong> (например, оставить только «Имя» и «Группа»).',why:'Это две самые частые операции. Запомни: сигма режет по горизонтали (строки), пи — по вертикали (столбцы).'},
{t:'Соединение (JOIN) и другие',lat:'операции над двумя таблицами',plain:'<strong>Соединение (⋈, JOIN)</strong> — склеивание двух таблиц по общему условию (самая используемая операция). Также есть объединение, пересечение, разность, декартово произведение (×) и деление (÷).',why:'JOIN — то, без чего не обходится ни одна реальная база: например, склеить таблицу заказов с таблицей клиентов.'}
],
example:`<p>Задача: «<strong>Имена студентов старше 18</strong>».</p><p>На языке реляционной алгебры: <code>π имя ( σ возраст>18 (Студенты) )</code></p><p>Читается изнутри наружу:<br>1. <strong>σ возраст>18</strong> — выбираем строки, где возраст больше 18.<br>2. <strong>π имя</strong> — из них оставляем только столбец «имя».</p><p>На привычном SQL то же самое: <code>SELECT имя FROM Студенты WHERE возраст > 18</code>. Видишь — алгебра и SQL это одно и то же, просто разная запись.</p>`,
check:{q:'Как «переводятся» отношение, кортеж, атрибут, и чем отличаются выборка и проекция?',a:'<strong>Отношение</strong> = таблица, <strong>кортеж</strong> = строка, <strong>атрибут</strong> = столбец. <strong>Выборка (σ)</strong> отбирает <strong>строки</strong> по условию, <strong>проекция (π)</strong> отбирает <strong>столбцы</strong>. Сигма режет по горизонтали, пи — по вертикали.'},
formal:`<p><strong>Реляционная алгебра</strong> — формальный аппарат операций над отношениями, теоретическая основа SQL. Понятия: <strong>отношение</strong> — таблица (множество кортежей); <strong>схема</strong> — имя отношения и набор атрибутов; <strong>атрибут</strong> — столбец со значениями из домена; <strong>кортеж</strong> — строка. Операции: <strong>выборка (σ)</strong> — отбор строк по условию; <strong>проекция (π)</strong> — отбор столбцов; объединение, пересечение, разность; декартово произведение (×); <strong>соединение (⋈, JOIN)</strong> — связывание по условию; деление (÷).</p>`,
remember:['Реляционная алгебра — теоретическая основа SQL','<strong>Отношение</strong>=таблица, <strong>кортеж</strong>=строка, <strong>атрибут</strong>=столбец, <strong>домен</strong>=тип','<strong>Выборка (σ)</strong> — отбор строк по условию','<strong>Проекция (π)</strong> — отбор столбцов','<strong>Соединение (⋈, JOIN)</strong> — склейка таблиц']
},
{
id:18,cat:'db',title:'СУБД. Типы, основные понятия',q:'Системы управления базами данных (СУБД). Типы СУБД, основные понятия.',
teaser:'Программа-«управляющий», которая хранит данные и даёт к ним доступ.',
intro:`<p><span class="q">Простыми словами.</span> <strong>База данных</strong> — это сами данные (например, все товары магазина). А <strong>СУБД</strong> — это программа, которая ими управляет: хранит, ищет, выдаёт, защищает.</p><p><span class="q">Зачем отдельная программа.</span> Без СУБД пришлось бы вручную копаться в файлах, следить, чтобы данные не противоречили друг другу, и как-то давать доступ сразу многим людям. СУБД делает всё это за тебя.</p>`,
concepts:[
{t:'СУБД',lat:'Система Управления Базами Данных',plain:'Программа-посредник между тобой и данными. Берёт на себя хранение, поиск, защиту, резервные копии и доступ для многих пользователей сразу. Примеры: MySQL, PostgreSQL, Oracle.',why:'Без СУБД работа с большими данными превратилась бы в кошмар. Она гарантирует, что данные не потеряются и не испортятся.'},
{t:'Реляционные СУБД',lat:'самые распространённые',plain:'Хранят данные в <strong>таблицах</strong>, связанных между собой. Запросы пишут на языке <strong>SQL</strong>. Это самый популярный тип. Примеры: PostgreSQL, MySQL, Oracle, MS SQL Server.',why:'90% задач решаются реляционными СУБД — это основа. Когда говорят «база данных», обычно имеют в виду именно их.'},
{t:'NoSQL СУБД',lat:'нереляционные',plain:'Для случаев, когда таблицы неудобны: огромные объёмы или гибкая структура. Виды: <strong>документные</strong> (MongoDB — хранят JSON-документы), <strong>ключ-значение</strong> (Redis — как словарь), <strong>колоночные</strong> (Cassandra), <strong>графовые</strong> (Neo4j — для связей).',why:'Когда данных очень много или они плохо ложатся в таблицы, выбирают NoSQL. Каждый вид заточен под свою задачу.'},
{t:'Устаревшие типы',lat:'для полноты',plain:'<strong>Иерархические</strong> (данные в виде дерева) и <strong>сетевые</strong> (в виде графа) — старые типы, сейчас почти не используются.',why:'Стоит упомянуть для полноты классификации, но глубоко вникать не нужно.'},
{t:'Ключи и индексы',lat:'основные понятия',plain:'<strong>Первичный ключ</strong> — столбец, который уникально определяет каждую строку (как номер паспорта). <strong>Внешний ключ</strong> — ссылка на первичный ключ другой таблицы (так таблицы связываются). <strong>Индекс</strong> — структура для быстрого поиска (как алфавитный указатель в книге).',why:'Это базовые понятия любой базы. Первичный ключ — уникальность, внешний ключ — связи, индекс — скорость.'}
],
example:`<p>Интернет-магазин использует <strong>разные</strong> СУБД под разные задачи:</p><p>• Товары, заказы, клиенты — в <strong>реляционной</strong> СУБД (PostgreSQL), где «заказ» через внешний ключ ссылается на «клиента».<br>• Корзину и сессии пользователя для скорости — в <strong>Redis</strong> (ключ-значение, очень быстрый).<br>• Логи кликов для аналитики — в <strong>колоночной</strong> базе.</p><p>Каждая СУБД — под свою задачу.</p>`,
check:{q:'Чем реляционные СУБД отличаются от NoSQL, и что такое первичный и внешний ключ?',a:'<strong>Реляционные</strong> хранят данные в таблицах с языком SQL (PostgreSQL, MySQL). <strong>NoSQL</strong> — нереляционные, для больших/гибких данных (документные, ключ-значение, колоночные, графовые). <strong>Первичный ключ</strong> уникально идентифицирует строку, <strong>внешний ключ</strong> — ссылка на первичный ключ другой таблицы (реализует связь между таблицами).'},
formal:`<p><strong>СУБД</strong> — комплекс программных средств для создания, хранения и управления базами данных с обеспечением целостности и многопользовательского доступа. Типы по модели данных: иерархические, сетевые, <strong>реляционные</strong> (таблицы, язык SQL — PostgreSQL, MySQL, Oracle), объектно-ориентированные, <strong>NoSQL</strong> (документоориентированные — MongoDB, ключ-значение — Redis, колоночные — Cassandra, графовые — Neo4j). Основные понятия: таблица, запись, поле, первичный ключ, внешний ключ, индекс, транзакция, ACID.</p>`,
remember:['<strong>СУБД</strong> — программа управления данными (хранение, поиск, защита, доступ)','<strong>Реляционные</strong> — таблицы + SQL (PostgreSQL, MySQL) — самые частые','<strong>NoSQL</strong> — документные, ключ-значение, колоночные, графовые','<strong>Первичный ключ</strong> — уникальность строки, <strong>внешний ключ</strong> — связь таблиц','<strong>Индекс</strong> — для быстрого поиска']
},
{
id:19,cat:'alg',title:'Сортировки. Сложность. P, NP',q:'Сортировка данных. Виды сортировки, оценка сложности. P, NP, NP-трудная задача.',
teaser:'Как упорядочить список и как измерить, насколько алгоритм быстрый.',
intro:`<p><span class="q">Простыми словами.</span> Тут две связанные темы. Первая — <strong>сортировка</strong> (как упорядочить список, например по возрастанию). Вторая — <strong>оценка сложности</strong> (как измерить, насколько алгоритм быстрый).</p><p><span class="q">Зачем это нужно.</span> Сортировать можно разными способами, и они сильно отличаются по скорости: на миллионе элементов один способ сработает за секунду, другой — за час. Важно знать, какой когда применять.</p>`,
concepts:[
{t:'Что такое сложность O(...)',lat:'О-нотация',plain:'Способ записать, <strong>как растёт время</strong> работы при росте объёма данных (n — количество данных). <strong>O(n)</strong> — растёт пропорционально (вдвое больше данных = вдвое дольше). <strong>O(n²)</strong> — растёт квадратично (вдвое больше = вчетверо дольше, медленно). <strong>O(n log n)</strong> — растёт медленно, это хорошо.',why:'Это универсальный «язык скорости» алгоритмов, не зависящий от конкретного компьютера. Чем медленнее растёт — тем лучше алгоритм на больших данных.'},
{t:'Медленные сортировки O(n²)',lat:'простые',plain:'<strong>Пузырьковая, выбором, вставками</strong> — простые в реализации, но медленные: сложность <strong>O(n²)</strong>. На больших данных тормозят.',why:'Их учат для понимания принципа, но в реальности на больших данных не используют. Пузырьковая — самая известная учебная.'},
{t:'Быстрые сортировки O(n log n)',lat:'эффективные',plain:'<strong>Быстрая (quicksort)</strong> — в среднем O(n log n), на практике самая быстрая. <strong>Слиянием (merge sort)</strong> — всегда O(n log n) и «устойчивая». <strong>Пирамидальная (heap)</strong> — тоже O(n log n).',why:'Это то, что реально используют. Важный факт: быстрее, чем O(n log n), отсортировать сравнением в принципе нельзя — это нижняя граница.'},
{t:'Классы P и NP',lat:'сложность задач',plain:'<strong>P</strong> — задачи, которые <strong>решаются</strong> быстро (за полиномиальное время). <strong>NP</strong> — задачи, где быстро можно только <strong>проверить</strong> готовый ответ, а найти его трудно. Пример NP: судоку — проверить готовое решение легко, а решить большое — долго.',why:'Это про принципиальную сложность задач. P — «легко решить», NP — «легко проверить, трудно решить».'},
{t:'NP-полные и NP-трудные',lat:'самые сложные',plain:'<strong>NP-полные</strong> — самые трудные задачи в классе NP; если научиться быстро решать хоть одну, то и все NP. <strong>NP-трудные</strong> — не легче NP-полных, могут быть ещё сложнее. Знаменитый вопрос <strong>«P = NP?»</strong> до сих пор не решён.',why:'Это вершина теории сложности. Пример NP-полной — задача коммивояжёра (найти кратчайший маршрут через все города).'}
],
example:`<p>Сортируем <strong>1000 элементов</strong>:</p><p>• <strong>Пузырьком</strong> (O(n²)): примерно 1 000 000 операций.<br>• <strong>Быстрой</strong> (O(n log n)): примерно 10 000 операций.</p><p>Разница — <strong>в 100 раз!</strong> А на миллионе элементов разница будет уже в тысячи раз. Вот почему выбор алгоритма критичен на больших данных.</p>`,
check:{q:'Чем отличаются классы P и NP?',a:'<strong>P</strong> — задачи, которые можно <strong>решить</strong> за полиномиальное (быстрое) время. <strong>NP</strong> — задачи, решение которых можно быстро <strong>проверить</strong>, но найти, возможно, трудно. Пример: судоку — проверить готовый ответ легко (NP), а решить большое — долго. Вопрос, равны ли P и NP, остаётся открытым.'},
formal:`<p><strong>Сортировка</strong> — упорядочение элементов; эффективность оценивается асимптотической сложностью (О-нотацией). Простые сортировки (пузырьком, выбором, вставками) — O(n²). Эффективные — O(n log n): быстрая (в среднем), слиянием (всегда и устойчивая), пирамидальная. Нижняя граница сортировки сравнениями — O(n log n). Классы задач: <strong>P</strong> — решаются за полиномиальное время; <strong>NP</strong> — решение проверяется за полиномиальное время; <strong>NP-полные</strong> — сложнейшие в NP; <strong>NP-трудные</strong> — не легче. Вопрос P = NP открыт.</p>`,
remember:['<strong>O(n²)</strong> — медленные (пузырёк, выбор, вставки)','<strong>O(n log n)</strong> — быстрые (quicksort, merge, heap); быстрее нельзя','<strong>P</strong> — решаются быстро','<strong>NP</strong> — проверяются быстро, решаются трудно','<strong>NP-полные/трудные</strong> — самые сложные; P=NP открыт']
},
{
id:20,cat:'alg',title:'Структуры данных',q:'Структуры данных. Списки, массивы, deque, queue, stack.',
diagram:'<svg viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.cell{fill:#1c1f29;stroke:var(--cat);stroke-width:1.5}.t1{fill:#ece8df;font-size:13px;font-weight:600;text-anchor:middle}.hd{fill:var(--cat);font-size:13px;font-weight:700;text-anchor:middle;font-family:JetBrains Mono,monospace}.lb{fill:#9b978d;font-size:11px;text-anchor:middle}.ar{stroke:var(--cat);stroke-width:2;fill:none;marker-end:url(#b)}</style><defs><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="var(--cat)"/></marker></defs><text class="hd" x="105" y="22">СТЕК (LIFO)</text><rect class="cell" x="60" y="40" width="90" height="30"/><text class="t1" x="105" y="60">3 ← верх</text><rect class="cell" x="60" y="70" width="90" height="30"/><text class="t1" x="105" y="90">2</text><rect class="cell" x="60" y="100" width="90" height="30"/><text class="t1" x="105" y="120">1 ← низ</text><path class="ar" d="M105 195 L105 165"/><path class="ar" d="M165 80 L105 80" opacity="0"/><text class="lb" x="105" y="155">↑↓ кладём и берём сверху</text><text class="lb" x="105" y="210">стопка тарелок</text><text class="hd" x="330" y="22">ОЧЕРЕДЬ (FIFO)</text><rect class="cell" x="250" y="55" width="50" height="40"/><text class="t1" x="275" y="80">1</text><rect class="cell" x="300" y="55" width="50" height="40"/><text class="t1" x="325" y="80">2</text><rect class="cell" x="350" y="55" width="50" height="40"/><text class="t1" x="375" y="80">3</text><path class="ar" d="M240 75 L248 75"/><path class="ar" d="M402 75 L420 75"/><text class="lb" x="245" y="120">вход →</text><text class="lb" x="410" y="120">→ выход</text><text class="lb" x="330" y="210">очередь в магазине</text></svg><div class=\'dg-cap\'><b>Стек</b> — кладём и берём с одного конца (как стопка тарелок). <b>Очередь</b> — входим с одной стороны, выходим с другой (как очередь в магазине).</div>',
teaser:'Способы организовать данные в памяти под конкретную задачу.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Структура данных</strong> — способ организовать данные в памяти так, чтобы с ними было удобно работать. Под разные задачи — разные структуры.</p><p><span class="q">Зачем их несколько.</span> У каждой свои сильные стороны. Одна позволяет быстро брать элемент по номеру, другая — быстро вставлять в середину, третья удобна для порядка «кто последний пришёл — первый ушёл». Выбираешь под задачу.</p>`,
concepts:[
{t:'Массив',lat:'array',plain:'Элементы лежат <strong>подряд</strong> в памяти, как пронумерованные почтовые ящики. Взять элемент по номеру — мгновенно, <strong>O(1)</strong>. Но вставить в середину — медленно, <strong>O(n)</strong>: надо сдвигать все следующие.',why:'Идеален, когда часто берёшь по индексу и редко вставляешь в середину. Размер обычно фиксирован.'},
{t:'Связный список',lat:'linked list',plain:'Элементы (узлы) разбросаны по памяти, каждый хранит <strong>ссылку на следующий</strong>, как цепочка, где все держатся за руки. Вставить/удалить — быстро, <strong>O(1)</strong>. Но взять по номеру — медленно, <strong>O(n)</strong>: надо идти с начала по цепочке.',why:'Противоположность массива: где массив быстр, список медленный, и наоборот. Выбор зависит от того, что делаешь чаще.'},
{t:'Стек',lat:'stack — принцип LIFO',plain:'Работает по принципу <strong>LIFO</strong> (Last In, First Out — «последним пришёл, первым ушёл»), как стопка тарелок: кладёшь и берёшь только сверху. Операции: push (положить), pop (снять).',why:'Применяется для отмены действий (Ctrl+Z), стека вызовов функций, проверки скобок. Пример: кнопка «Назад» в браузере.'},
{t:'Очередь',lat:'queue — принцип FIFO',plain:'Работает по принципу <strong>FIFO</strong> (First In, First Out — «первым пришёл, первым ушёл»), как очередь в магазине: кто первый встал, тот первый и обслужен.',why:'Применяется для обработки задач по порядку, печати документов, обхода в ширину (BFS).'},
{t:'Дек',lat:'deque — двусторонняя очередь',plain:'Очередь, в которую можно <strong>добавлять и удалять с обоих концов</strong> (и спереди, и сзади). Универсальная — может работать и как стек, и как очередь.',why:'Гибкая структура для случаев, когда нужен доступ с обеих сторон.'}
],
example:`<p>Где это в жизни:</p><p>• <strong>Стек (LIFO):</strong> кнопка «Назад» в браузере. Каждый переход кладётся в стопку, нажал «Назад» — снимается последний (верхний).</p><p>• <strong>Очередь (FIFO):</strong> печать документов. Какой файл отправил на печать первым — тот первым и напечатается.</p><p>Запомни картинки: стек — стопка тарелок, очередь — очередь в магазине.</p>`,
check:{q:'Чем стек отличается от очереди, и чем массив от списка?',a:'<strong>Стек</strong> — LIFO (последним пришёл, первым ушёл, как стопка тарелок). <strong>Очередь</strong> — FIFO (первым пришёл, первым ушёл, как очередь в магазине). <strong>Массив</strong> — быстрый доступ по индексу O(1), но медленная вставка O(n). <strong>Список</strong> — наоборот: быстрая вставка O(1), но медленный доступ O(n).'},
formal:`<p><strong>Структура данных</strong> — способ организации данных для эффективного выполнения операций. <strong>Массив</strong> — элементы в непрерывной памяти; доступ по индексу O(1), вставка в середину O(n). <strong>Связный список</strong> — узлы со ссылками; вставка O(1), доступ по индексу O(n). <strong>Стек</strong> работает по принципу LIFO (последним пришёл — первым вышел), операции push/pop. <strong>Очередь</strong> — по принципу FIFO (первым пришёл — первым вышел). <strong>Дек (deque)</strong> допускает добавление и удаление с обоих концов.</p>`,
remember:['<strong>Массив</strong> — доступ O(1), вставка в середину O(n)','<strong>Список</strong> — вставка O(1), доступ по индексу O(n)','<strong>Стек</strong> — LIFO (стопка тарелок), push/pop','<strong>Очередь</strong> — FIFO (очередь в магазине)','<strong>Дек</strong> — добавление/удаление с обоих концов']
},
{
id:21,cat:'db',title:'Транзакции. Блокировки. Уровни изоляции',q:'Транзакции. Определение, блокировки транзакций, уровни изоляции.',
diagram:'<svg viewBox="0 0 440 210" xmlns="http://www.w3.org/2000/svg" font-family="Hanken Grotesk,sans-serif"><style>.bx{fill:#1c1f29;stroke:var(--cat);stroke-width:2}.ok{fill:var(--cat)}.t1{fill:#ece8df;font-size:13px;text-anchor:middle}.t2{fill:#11110d;font-size:13px;font-weight:700;text-anchor:middle}.ts{fill:#9b978d;font-size:11px;text-anchor:middle}.hd{fill:var(--cat);font-size:12px;font-weight:700;text-anchor:middle;font-family:JetBrains Mono,monospace}.ar{stroke:var(--cat);stroke-width:2;fill:none;marker-end:url(#e)}</style><defs><marker id="e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="var(--cat)"/></marker></defs><text class="hd" x="220" y="20">Транзакция: перевод денег — «всё или ничего»</text><rect class="bx" x="30" y="45" width="150" height="44" rx="8"/><text class="t1" x="105" y="72">1. Списать у A</text><rect class="bx" x="30" y="105" width="150" height="44" rx="8"/><text class="t1" x="105" y="132">2. Зачислить B</text><path class="ar" d="M105 89 L105 105"/><rect class="bx ok" x="250" y="45" width="160" height="44" rx="8"/><text class="t2" x="330" y="65">Успех → COMMIT</text><text class="t2" x="330" y="81" style="font-size:10px">оба действия сохранены</text><rect class="bx" x="250" y="105" width="160" height="44" rx="8" stroke-dasharray="4"/><text class="t1" x="330" y="125">Сбой → ROLLBACK</text><text class="ts" x="330" y="141">всё откатилось назад</text><path class="ar" d="M182 67 L248 67"/><path class="ar" d="M182 127 L248 127"/><text class="hd" x="220" y="195">ACID: Atomicity · Consistency · Isolation · Durability</text></svg><div class=\'dg-cap\'>Оба действия выполняются вместе. Если всё прошло — <b>commit</b> (сохранить). Если сбой — <b>rollback</b> (откатить всё назад), чтобы деньги не пропали. Это и есть атомарность из ACID.</div>',
teaser:'Принцип «всё или ничего» при работе с базой данных.',
intro:`<p><span class="q">Простыми словами.</span> <strong>Транзакция</strong> — это группа действий с базой данных, которые должны выполниться <strong>все вместе или не выполниться вообще</strong>. Принцип «всё или ничего».</p><p><span class="q">Зачем это нужно.</span> Классический пример — перевод денег: списать у одного и зачислить другому. Если после списания компьютер завис — деньги исчезнут! Транзакция гарантирует: либо оба действия пройдут, либо ни одного.</p>`,
concepts:[
{t:'Транзакция',lat:'неделимая операция',plain:'Последовательность действий с базой, выполняемая как <strong>единое целое</strong>. Либо всё успешно завершилось (commit), либо всё откатилось назад (rollback) при ошибке.',why:'Защищает данные от «половинчатого» состояния, когда часть действий прошла, а часть нет — это привело бы к противоречиям (как пропавшие деньги).'},
{t:'Свойства ACID',lat:'4 гарантии транзакции',plain:'<strong>A — Atomicity (атомарность)</strong>: всё или ничего. <strong>C — Consistency (согласованность)</strong>: база остаётся в корректном состоянии. <strong>I — Isolation (изолированность)</strong>: параллельные транзакции не мешают друг другу. <strong>D — Durability (долговечность)</strong>: после подтверждения данные сохранятся даже при сбое питания.',why:'ACID — это «4 кита» надёжности транзакций, их почти всегда просят расшифровать. Запомни по буквам.'},
{t:'Блокировки',lat:'для изоляции',plain:'Когда с базой работают многие сразу, они могут мешать (двое меняют одну запись). <strong>Блокировка</strong> временно «запирает» данные. <strong>Разделяемая (Shared)</strong> — на чтение, можно нескольким сразу. <strong>Монопольная (Exclusive)</strong> — на запись, только одному.',why:'Блокировки обеспечивают изоляцию. Опасность — <strong>deadlock</strong> (взаимоблокировка): две транзакции бесконечно ждут ресурсы друг друга.'},
{t:'Аномалии параллельности',lat:'что может пойти не так',plain:'Если изоляция слабая, возникают проблемы: <strong>грязное чтение</strong> (прочитал чужие неподтверждённые данные, которые потом откатились), <strong>неповторяющееся чтение</strong> (прочитал дважды — получил разное), <strong>фантомное чтение</strong> (повторил запрос — появились новые строки).',why:'Эти три аномалии — то, от чего защищают уровни изоляции. Каждый следующий уровень убирает ещё одну.'},
{t:'Уровни изоляции',lat:'от слабого к строгому',plain:'Настройка строгости изоляции: <strong>Read Uncommitted</strong> (слабый, допускает всё) → <strong>Read Committed</strong> (нет грязного чтения) → <strong>Repeatable Read</strong> (нет и неповторяющегося) → <strong>Serializable</strong> (самый строгий, нет и фантомов).',why:'Компромисс: чем строже изоляция — тем надёжнее, но медленнее. Выбирают под задачу.'}
],
example:`<p>Перевод <strong>1000 ₽</strong> с карты A на карту B — это транзакция из двух действий:</p><p>1. Списать 1000 ₽ с карты A.<br>2. Зачислить 1000 ₽ на карту B.</p><p>Представь, что сервер <strong>завис после шага 1</strong>. Благодаря <strong>атомарности</strong> (A в ACID) транзакция откатится — деньги вернутся на A, не пропадут. А если A в этот момент смотрит баланс, благодаря <strong>изоляции</strong> (I) он не увидит «полупереведённое» состояние.</p>`,
check:{q:'Что такое ACID и что гарантирует атомарность?',a:'<strong>ACID</strong> — четыре свойства транзакции: <strong>A</strong>tomicity (атомарность), <strong>C</strong>onsistency (согласованность), <strong>I</strong>solation (изолированность), <strong>D</strong>urability (долговечность). <strong>Атомарность</strong> гарантирует принцип «всё или ничего»: транзакция либо выполняется полностью, либо при сбое полностью откатывается, не оставляя половинчатого состояния.'},
formal:`<p><strong>Транзакция</strong> — неделимая последовательность операций над БД по принципу «всё или ничего». Свойства <strong>ACID</strong>: атомарность (всё или ничего), согласованность (БД остаётся целостной), изолированность (транзакции не влияют друг на друга), долговечность (результат сохраняется при сбое). Изоляция реализуется блокировками: разделяемая (Shared) на чтение, монопольная (Exclusive) на запись; риск — deadlock. Аномалии: грязное, неповторяющееся, фантомное чтение. Уровни изоляции (по усилению): Read Uncommitted, Read Committed, Repeatable Read, Serializable.</p>`,
remember:['<strong>Транзакция</strong> — «всё или ничего»','<strong>ACID</strong>: Atomicity, Consistency, Isolation, Durability','Блокировки: <strong>Shared</strong> (чтение) / <strong>Exclusive</strong> (запись); риск deadlock','Аномалии: грязное, неповторяющееся, фантомное чтение','Уровни: Read Uncommitted → Committed → Repeatable Read → Serializable']
},

id:22,cat:'sys',title:'Языки моделирования: UML, IDEF0, IDEF1X',q:'Языки моделирования данных. UML, IDEF0, IDEFX.',
teaser:'Стандартные способы рисовать схемы системы перед её постройкой.',
intro:`<p><span class="q">Простыми словами.</span> Прежде чем строить программу или базу, систему сначала <strong>рисуют</strong> — как архитектор делает чертёж до стройки. <strong>Языки моделирования</strong> — стандартные способы рисовать такие схемы, понятные всем разработчикам.</p><p><span class="q">Зачем рисовать, а не сразу делать.</span> Чтобы увидеть систему целиком, найти проблемы заранее и чтобы вся команда одинаково понимала, что строят. Поправить чертёж дешевле, чем переделывать готовое.</p>`,
concepts:[
{t:'UML',lat:'Unified Modeling Language',plain:'Самый популярный язык, для моделирования <strong>программ и объектов</strong>. Набор разных диаграмм. Делятся на <strong>структурные</strong> (что система есть — главная это диаграмма классов) и <strong>поведенческие</strong> (как работает).',why:'UML — стандарт в разработке ПО. Главная диаграмма — классов: показывает классы, их свойства, методы и связи.'},
{t:'Диаграммы UML',lat:'какие бывают',plain:'<strong>Структурные:</strong> диаграмма классов (главная), компонентов. <strong>Поведенческие:</strong> вариантов использования (use case — кто что делает в системе), последовательности (sequence — порядок сообщений), деятельности (activity — как блок-схема), состояний (state).',why:'На экзамене стоит назвать деление на структурные/поведенческие и привести по паре примеров каждой.'},
{t:'IDEF0',lat:'функциональное моделирование',plain:'Описывает систему как набор <strong>функций (блоков)</strong>. Каждый блок описывается четырьмя стрелками <strong>ICOM</strong>: <strong>I</strong>nput (вход слева — что обрабатываем), <strong>C</strong>ontrol (управление сверху — по каким правилам), <strong>O</strong>utput (выход справа — результат), <strong>M</strong>echanism (механизм снизу — кто/чем выполняет).',why:'IDEF0 показывает, ЧТО система делает (процессы, функции). Строится «сверху вниз»: общий блок дробится на подфункции (декомпозиция). ICOM — ключевое слово.'},
{t:'IDEF1X',lat:'моделирование данных',plain:'Описывает <strong>структуру данных</strong> — разновидность модели «сущность-связь». Показывает сущности (таблицы), их атрибуты, ключи и связи для проектирования реляционной базы.',why:'Если UML про программу, а IDEF0 про процессы, то IDEF1X — про данные/базу. Три разных языка для трёх разных задач.'}
],
example:`<p>Проектируем интернет-магазин — каждый язык для своего:</p><p>• <strong>UML, use case:</strong> показывает действия — «Клиент → оформить заказ», «Админ → добавить товар».<br>• <strong>UML, диаграмма классов:</strong> классы Товар, Заказ, Клиент и связи между ними.<br>• <strong>IDEF0:</strong> процесс «Обработать заказ» (вход: заявка; управление: правила скидок; механизм: менеджер; выход: отгрузка).<br>• <strong>IDEF1X:</strong> структуру таблиц базы данных.</p>`,
check:{q:'Чем различаются UML, IDEF0 и IDEF1X по назначению?',a:'<strong>UML</strong> — для моделирования программ и объектов (диаграммы классов, use case и др.). <strong>IDEF0</strong> — для описания функций и процессов (что система делает, стрелки ICOM: вход, управление, выход, механизм). <strong>IDEF1X</strong> — для структуры данных (сущности и связи для базы). Три языка — три задачи: программа, процессы, данные.'},
formal:`<p><strong>Языки моделирования</strong> — формализованные нотации для графического описания системы. <strong>UML</strong> — язык объектного моделирования; диаграммы делятся на структурные (классов — главная, компонентов) и поведенческие (вариантов использования, последовательности, деятельности, состояний). <strong>IDEF0</strong> — функциональное моделирование: система как блоки-функции со стрелками ICOM (вход, управление, выход, механизм), декомпозиция сверху вниз. <strong>IDEF1X</strong> — моделирование данных (разновидность «сущность-связь») для проектирования реляционных БД.</p>`,
remember:['<strong>UML</strong> — программы и объекты (структурные + поведенческие диаграммы)','Главная диаграмма UML — <strong>классов</strong>','<strong>IDEF0</strong> — функции/процессы, стрелки <strong>ICOM</strong> (вход, управление, выход, механизм)','<strong>IDEF1X</strong> — структура данных (сущность-связь для БД)','Три языка: UML — программа, IDEF0 — процессы, IDEF1X — данные']
}
];

/* ===== ГЛОССАРИЙ (всплывающие подсказки для вторичных терминов) ===== */
const GLOSSARY={
  'DOM':'Представление HTML-страницы в виде дерева объектов, которое можно менять из JavaScript.',
  'ORM':'Технология, автоматически связывающая классы программы с таблицами базы данных.',
  'TLS':'Протокол шифрования, обеспечивающий защищённое соединение (основа HTTPS).',
  'cookie':'Небольшие данные, которые сайт сохраняет в браузере, чтобы «помнить» пользователя.',
  'NAT':'Технология, скрывающая адреса домашней сети за одним внешним IP (роутер).',
  'JSON':'Текстовый формат хранения данных в виде пар «ключ: значение».',
  'commit':'Подтверждение транзакции — фиксация всех изменений в базе данных.',
  'rollback':'Откат транзакции — отмена всех её изменений при ошибке.',
  'deadlock':'Взаимоблокировка: две транзакции бесконечно ждут ресурсы друг друга.',
  'use case':'Диаграмма UML, показывающая, кто и какие действия выполняет в системе.',
  'факторизац':'Разложение числа на простые множители; для больших чисел очень сложно.',
  'полиномиальн':'Время работы, растущее как степень размера данных (n², n³) — считается «быстрым».',
  'устойчив':'Свойство сортировки сохранять исходный порядок равных элементов.',
  'миграц':'Механизм пошагового изменения структуры базы данных с сохранением версий.',
  'индекс':'Структура данных, ускоряющая поиск записей в таблице (как указатель в книге).',
  'фаервол':'Защитный экран, фильтрующий сетевые соединения.'
};
const glossKeys=Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length);
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
const glossRe=new RegExp('('+glossKeys.map(escapeRe).join('|')+')','gi');
function htmlEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function applyGlossary(root){
  if(!root)return;
  const skip=new Set(['CODE','PRE','BUTTON','STRONG']);
  const seen=new Set();
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    let p=node.parentElement;
    while(p&&p!==root){if(skip.has(p.tagName)||p.classList.contains('gloss'))return NodeFilter.FILTER_REJECT;p=p.parentElement;}
    return glossRe.test(node.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const targets=[];while(walker.nextNode())targets.push(walker.currentNode);
  targets.forEach(node=>{
    glossRe.lastIndex=0;let html='',last=0,m,changed=false;
    while((m=glossRe.exec(node.nodeValue))){
      const key=m[1],low=key.toLowerCase();
      const dictKey=glossKeys.find(k=>k.toLowerCase()===low)||glossKeys.find(k=>low.startsWith(k.toLowerCase()));
      if(!dictKey||seen.has(dictKey.toLowerCase())){continue;}
      seen.add(dictKey.toLowerCase());
      const def=GLOSSARY[dictKey];
      html+=htmlEsc(node.nodeValue.slice(last,m.index))+`<span class="gloss" data-def="${def.replace(/"/g,'&quot;')}" data-term="${key.replace(/"/g,'&quot;')}">${key}</span>`;
      last=m.index+key.length;changed=true;
    }
    if(changed){html+=htmlEsc(node.nodeValue.slice(last));const span=document.createElement('span');span.innerHTML=html;node.parentNode.replaceChild(span,node);}
  });
}
let glossPop=null;
function showGloss(el){hideGloss();glossPop=document.createElement('div');glossPop.className='gloss-pop';glossPop.innerHTML=`<b>${el.dataset.term}</b>${el.dataset.def}`;document.body.appendChild(glossPop);const r=el.getBoundingClientRect();const pw=Math.min(300,window.innerWidth-24);let left=r.left+r.width/2-pw/2;left=Math.max(12,Math.min(left,window.innerWidth-pw-12));glossPop.style.width=pw+'px';glossPop.style.left=left+'px';let top=r.bottom+8;glossPop.style.top=top+'px';requestAnimationFrame(()=>{const ph=glossPop.offsetHeight;if(top+ph>window.innerHeight-12)glossPop.style.top=(r.top-ph-8)+'px';glossPop.classList.add('show');});}
function hideGloss(){if(glossPop){glossPop.remove();glossPop=null;}}
document.addEventListener('mouseover',e=>{const g=e.target.closest('.gloss');if(g)showGloss(g);});
document.addEventListener('mouseout',e=>{if(e.target.closest('.gloss'))hideGloss();});
document.addEventListener('click',e=>{const g=e.target.closest('.gloss');if(g){e.stopPropagation();showGloss(g);}else hideGloss();});
window.addEventListener('scroll',hideGloss,true);

/* ===== STATE ===== */
const learned=new Set();
let curCat='all',curSearch='',mode='grid',lessonId=null;
const view=document.getElementById('view');

function go(m){mode=m;lessonId=null;document.getElementById('tab-grid').classList.toggle('active',m==='grid');document.getElementById('tab-flash').classList.toggle('active',m==='flash');document.getElementById('tab-howto').classList.toggle('active',m==='howto');render();window.scrollTo({top:0,behavior:'smooth'});}
function openLesson(id){mode='lesson';lessonId=id;render();window.scrollTo({top:0});}
function onSearch(v){curSearch=v.toLowerCase().trim();if(mode!=='grid')go('grid');else render();}
function updateProgress(){const n=learned.size;document.getElementById('learned-n').textContent=n;const c=2*Math.PI*16,off=c*(1-n/22);const fg=document.getElementById('ring-fg');fg.style.strokeDasharray=c;fg.style.strokeDashoffset=off;}
function toggleLearned(id,e){if(e)e.stopPropagation();learned.has(id)?learned.delete(id):learned.add(id);updateProgress();render();}
function setCat(c){curCat=c;render();}
function stripTags(h){return h.replace(/<[^>]+>/g,'');}
function filtered(){return TOPICS.filter(t=>{if(curCat!=='all'&&t.cat!==curCat)return false;if(curSearch){const hay=(t.title+' '+t.q+' '+t.teaser+' '+t.intro).toLowerCase();if(!hay.includes(curSearch))return false;}return true;});}

function copyFormal(id,e){if(e)e.stopPropagation();const el=document.getElementById('formal-'+id);if(!el)return;const text=el.innerText.trim();const btn=e.currentTarget;navigator.clipboard.writeText(text).then(()=>{btn.classList.add('copied');const o=btn.innerHTML;btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>скопировано';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML=o;},1800);}).catch(()=>{btn.textContent='выдели вручную';});}
function revealAnswer(id){const a=document.getElementById('sc-ans-'+id);const b=document.getElementById('sc-btn-'+id);if(a){a.classList.add('show');if(b)b.style.display='none';}}

function render(){if(mode==='lesson')return renderLesson();if(mode==='flash')return renderFlash();if(mode==='howto')return renderHowto();renderGrid();}

/* ===== GRID ===== */
function renderGrid(){
  const counts={all:TOPICS.length};TOPICS.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
  let chips=`<button class="chip ${curCat==='all'?'active':''}" style="${curCat==='all'?'background:var(--accent);color:#10110f':''}" onclick="setCat('all')">Все · ${counts.all}</button>`;
  for(const k in CATS){if(!counts[k])continue;const a=curCat===k;chips+=`<button class="chip ${a?'active':''}" style="${a?`background:${CATS[k].color};color:#10110f`:`color:${CATS[k].color}`}" onclick="setCat('${k}')"><span class="dot"></span>${CATS[k].label} · ${counts[k]}</button>`;}
  const list=filtered();let cards='';
  list.forEach((t,i)=>{const c=CATS[t.cat];cards+=`<article class="card ${learned.has(t.id)?'learned':''}" style="--cat:${c.color};animation-delay:${i*0.04}s" onclick="openLesson(${t.id})"><span class="num">${String(t.id).padStart(2,'0')}</span><span class="cat-tag"><span class="dot"></span>${c.label}</span><h3>${t.title}</h3><p class="teaser">${t.teaser}</p><span class="learned-badge"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--cat)"/><path d="m7 12 3 3 7-7" fill="none" stroke="#11110d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></article>`;});
  view.innerHTML=`<section class="hero"><div class="kick">учим с самого нуля</div><h2>Каждая тема — <em>урок с репетитором</em>, а не стена текста.</h2><p>Открой тему — и тебя проведут за руку: что это, зачем нужно, как расшифровывается. Каждое понятие разбирается отдельно, простыми словами, с примером и проверкой себя.</p><div class="hero-tip"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Незнакомые термины <b>подчёркнуты точками</b> — наведи или нажми, выскочит объяснение. Внизу каждой темы — мини-вопрос для самопроверки.</span></div></section><div class="chips">${chips}</div>${list.length?`<div class="grid">${cards}</div>`:`<div class="empty">Ничего не нашлось по запросу «${curSearch}».</div>`}`;
  updateProgress();
}

/* ===== LESSON (диалоговый формат) ===== */
function renderLesson(){
  const t=TOPICS.find(x=>x.id===lessonId);const c=CATS[t.cat];
  const idx=TOPICS.findIndex(x=>x.id===lessonId);
  const prev=idx>0?TOPICS[idx-1]:null,next=idx<TOPICS.length-1?TOPICS[idx+1]:null;
  const done=learned.has(t.id);

  // понятия как карточки «термин → что это → зачем»
  let conceptsHtml='';
  t.concepts.forEach((cc,i)=>{
    conceptsHtml+=`<div class="concept"><div class="cc-head"><div class="cc-icon">${i+1}</div><div class="cc-term">${cc.t}${cc.lat?` <span class="lat">${cc.lat}</span>`:''}</div></div><div class="cc-body"><div class="cc-row"><div class="rlabel">Что это</div><div class="rtext">${cc.plain}</div></div>${cc.why?`<div class="cc-row why"><div class="rlabel">Зачем / почему</div><div class="rtext">${cc.why}</div></div>`:''}</div></div>`;
  });

  let rememberHtml='';t.remember.forEach(r=>rememberHtml+=`<li>${r}</li>`);

  view.innerHTML=`<article class="lesson" style="--cat:${c.color}">
    <button class="back" onclick="go('grid')">← все темы</button>
    <div class="l-head"><div class="l-num">${String(t.id).padStart(2,'0')}</div><div class="l-head-txt"><span class="l-cat"><span class="dot"></span>${c.label}</span><h1 class="l-title">${t.title}</h1></div></div>

    <div class="intro"><div class="ib-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Сначала — о чём вообще речь</div>${t.intro}</div>

    <div class="ls-title"><span class="bar"></span><h3>Разбираем по понятиям</h3></div>
    <p class="ls-sub">Каждое понятие отдельно: что это и зачем. Не спеши — это ядро темы.</p>
    ${conceptsHtml}

    ${t.diagram?`<div class="ls-title"><span class="bar"></span><h3>Схема</h3></div><p class="ls-sub">Картинка вместо тысячи слов — так это выглядит наглядно.</p><div class="diagram-box">${t.diagram}</div>`:''}

    <div class="ls-title"><span class="bar"></span><h3>Пример из жизни</h3></div>
    <p class="ls-sub">Как это работает на конкретном случае.</p>
    <div class="example-box"><div class="eb-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.5.4.8 1 .8 1.6V18M12 2a7 7 0 0 1 4 12.7c-.5.4-.8 1-.8 1.6V18"/></svg>Пример</div>${t.example}</div>

    <div class="ls-title"><span class="bar"></span><h3>Проверь себя</h3></div>
    <p class="ls-sub">Попробуй ответить сам, прежде чем смотреть.</p>
    <div class="selfcheck"><div class="sc-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>Вопрос на понимание</div><div class="sc-q">${t.check.q}</div><button class="sc-reveal" id="sc-btn-${t.id}" onclick="revealAnswer(${t.id})">Показать ответ</button><div class="sc-answer" id="sc-ans-${t.id}">${t.check.a}</div></div>

    <div class="ls-title"><span class="bar"></span><h3>Как написать на экзамене</h3></div>
    <p class="ls-sub">Готовый связный ответ — можно запомнить и воспроизвести.</p>
    <div class="formal-box"><div class="fb-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Формальный ответ</div><button class="copy-btn" onclick="copyFormal(${t.id},event)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>копировать</button><div id="formal-${t.id}">${t.formal}</div></div>

    <div class="remember-box"><div class="rb-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>Что точно запомнить</div><ul>${rememberHtml}</ul></div>

    <button class="mark-btn ${done?'done':''}" onclick="toggleLearned(${t.id})">${done?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5 9-9"/></svg> Тема изучена':'Отметить тему как изученную'}</button>

    <nav class="l-nav"><button ${prev?`onclick="openLesson(${prev.id})"`:'disabled'}><span class="dir">← предыдущая</span><span class="nt">${prev?prev.title:'—'}</span></button><button class="next" ${next?`onclick="openLesson(${next.id})"`:'disabled'}><span class="dir">следующая →</span><span class="nt">${next?next.title:'—'}</span></button></nav>
  </article>`;

  // подсветка терминов в объяснениях (не в формальном ответе)
  view.querySelectorAll('.intro, .cc-row .rtext, .example-box, .sc-answer').forEach(applyGlossary);
  updateProgress();
}

/* ===== FLASHCARDS ===== */
let flashDeck=[],flashIdx=0,flashFlipped=false,flashCat='all';
function buildDeck(){flashDeck=TOPICS.filter(t=>flashCat==='all'||t.cat===flashCat);for(let i=flashDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[flashDeck[i],flashDeck[j]]=[flashDeck[j],flashDeck[i]];}flashIdx=0;flashFlipped=false;}
function renderFlash(){
  if(!flashDeck.length)buildDeck();
  const counts={all:TOPICS.length};TOPICS.forEach(t=>counts[t.cat]=(counts[t.cat]||0)+1);
  let pick=`<button class="chip ${flashCat==='all'?'active':''}" style="${flashCat==='all'?'background:var(--accent);color:#10110f':''}" onclick="setFlashCat('all')">Все</button>`;
  for(const k in CATS){if(!counts[k])continue;const a=flashCat===k;pick+=`<button class="chip ${a?'active':''}" style="${a?`background:${CATS[k].color};color:#10110f`:`color:${CATS[k].color}`}" onclick="setFlashCat('${k}')"><span class="dot"></span>${CATS[k].label}</button>`;}
  const t=flashDeck[flashIdx];const c=CATS[t.cat];
  const ans=t.remember.map(r=>'• '+stripTags(r)).join('<br>');
  view.innerHTML=`<div style="max-width:620px;margin:0 auto;animation:fadeUp .4s">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)">Карточка ${flashIdx+1} / ${flashDeck.length}</span><button class="back" style="margin:0" onclick="reshuffle()">⟳ перемешать</button></div>
    <div class="chips" style="justify-content:center;margin:0 0 22px">${pick}</div>
    <div onclick="flipCard()" style="cursor:pointer;background:${flashFlipped?'color-mix(in srgb,'+c.color+' 11%,var(--surface))':'var(--surface)'};border:1px solid ${flashFlipped?'color-mix(in srgb,'+c.color+' 30%,var(--line))':'var(--line)'};border-radius:20px;padding:40px 32px;min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center;transition:.3s">
      ${flashFlipped?`<div style="font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:${c.color};margin-bottom:16px">Что запомнить</div><div style="font-size:15.5px;line-height:1.7;color:#dcd8ce;text-align:left">${ans}</div>`:`<div style="font-family:'Fraunces',serif;font-size:50px;color:${c.color};opacity:.3;line-height:1;margin-bottom:14px">${String(t.id).padStart(2,'0')}</div><div style="font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:${c.color};margin-bottom:16px">${c.label}</div><div style="font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1.25">${t.title}</div><div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-2);margin-top:22px">нажми, чтобы увидеть суть →</div>`}
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px"><button class="sc-reveal" style="border-color:var(--line);color:var(--text)" onclick="prevCard(event)">← назад</button><button class="sc-reveal" style="background:var(--accent);color:#11110d;border-color:var(--accent)" onclick="nextCard(event)">${flashIdx===flashDeck.length-1?'сначала':'дальше →'}</button></div>
  </div>`;
}
function setFlashCat(c){flashCat=c;buildDeck();renderFlash();}
function flipCard(){flashFlipped=!flashFlipped;renderFlash();}
function nextCard(e){if(e)e.stopPropagation();flashIdx=(flashIdx+1)%flashDeck.length;flashFlipped=false;renderFlash();}
function prevCard(e){if(e)e.stopPropagation();flashIdx=(flashIdx-1+flashDeck.length)%flashDeck.length;flashFlipped=false;renderFlash();}
function reshuffle(){buildDeck();renderFlash();}
document.addEventListener('keydown',e=>{if(mode!=='flash')return;if(e.key==='ArrowRight')nextCard();else if(e.key==='ArrowLeft')prevCard();else if(e.key===' '){e.preventDefault();flipCard();}});

/* ===== HOWTO ===== */
function renderHowto(){
  view.innerHTML=`<div class="howto">
    <div class="kick">письменный экзамен · тактика</div>
    <h2>Как написать ответ <span style="font-style:italic;color:var(--accent)">на хороший балл</span></h2>
    <p class="lede">Знать тему и грамотно изложить — разные навыки. Преподаватель оценивает структуру, полноту и точность терминов. Стройте каждый ответ по единой схеме.</p>
    <h3><span class="hn">1</span>Схема ответа</h3>
    <div class="skeleton"><div class="sk-step"><h4>Определение</h4><p>Первая фраза — чёткое определение главного термина. Это «якорь» ответа.</p></div><div class="sk-step"><h4>Классификация / состав</h4><p>Перечислите виды, свойства или части. За перечни дают баллы.</p></div><div class="sk-step"><h4>Суть</h4><p>В 1–2 предложениях поясните, как работает и зачем нужно.</p></div><div class="sk-step"><h4>Пример</h4><p>Короткий конкретный пример — он доказывает понимание.</p></div></div>
    <h3><span class="hn">2</span>Что повышает и снижает балл</h3>
    <div class="dd-grid"><div class="dd good"><div class="dd-h">Повышает оценку</div><ul><li>Начинать с определения, выделять термины</li><li>Точная терминология вместо общих слов</li><li>Структура: абзацы и перечисления</li><li>Ответ на все части составного вопроса</li><li>Схемы, где уместно (OSI, дерево, V-модель)</li></ul></div><div class="dd bad"><div class="dd-h">Снижает оценку</div><ul><li>Сплошной текст без структуры</li><li>«Вода» вместо терминов и фактов</li><li>Ответ только на часть вопроса</li><li>Выдуманные факты при незнании</li><li>Потеря времени на одном вопросе</li></ul></div></div>
    <h3><span class="hn">3</span>Тактика по времени</h3>
    <div class="tactics"><b>На самом экзамене:</b> сначала набросайте на черновике скелет к каждому вопросу, затем начинайте с того, что знаете лучше; обязательно оставьте время на второй вопрос и финальную вычитку. Два средних ответа лучше одного идеального.</div>
    <p style="color:var(--muted);font-size:14px;margin:30px 0 0;padding-top:20px;border-top:1px solid var(--line-soft)">Формула <b style="color:var(--text)">определение → структура → суть → пример</b> работает для всех 22 тем. В каждом уроке блок «Формальный ответ» уже написан ровно по ней — можно учить как образец.</p>
  </div>`;
}

render();
</script>
</body>
</html>
